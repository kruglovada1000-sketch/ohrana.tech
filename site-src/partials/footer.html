<footer class="site-footer">
  <div class="wrap ft-grid">
    <div>
      <strong>{{site.name}}</strong>
      <p>Лицензия Росгвардии: {{site.license}}</p>
    </div>
    <div>
      <a href="tel:{{site.phone_href}}">{{site.phone}}</a><br>
      <a href="mailto:{{site.email}}">{{site.email}}</a>
    </div>
    <div>
      <a href="{{site.whatsapp_url}}" rel="noopener">WhatsApp</a><br>
      <a href="{{site.telegram_url}}" rel="noopener">Telegram</a>
    </div>
  </div>
  <div class="wrap ft-legal">
    <span>ИНН {{site.inn}} · КПП {{site.kpp}} · ОГРН {{site.ogrn}}</span>
  </div>
</footer>
