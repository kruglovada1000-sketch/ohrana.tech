name: Fix yin-yang animation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-yinyang-animation.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix yin-yang animation logic
        shell: python
        run: |
          from pathlib import Path

          # 1) Internal pages: do not recreate the icon on every theme change.
          js = Path('js/site.js')
          text = js.read_text(encoding='utf-8')
          old = """function forceYinYang(btn){\n  if(!btn)return;\n  btn.innerHTML='<span class=\"theme-yinyang\" aria-hidden=\"true\">☯</span>';\n  btn.title='Светлая / тёмная тема';\n}"""
          new = """function forceYinYang(btn){\n  if(!btn)return;\n  if(!btn.querySelector('.theme-yinyang')){\n    btn.innerHTML='<span class=\"theme-yinyang\" aria-hidden=\"true\">☯</span>';\n  }\n  btn.title='Светлая / тёмная тема';\n}"""
          if old not in text:
              raise SystemExit('forceYinYang block not found')
          text = text.replace(old, new, 1)
          js.write_text(text, encoding='utf-8')

          # 2) Common CSS: force the transform animation to remain enabled.
          css = Path('css/site-shell.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace('transition:transform .55s cubic-bezier(.22,.61,.36,1)!important;', 'transition:transform .72s cubic-bezier(.22,.61,.36,1)!important;')
          c = c.replace('@media(prefers-reduced-motion:reduce){\n  .theme-yinyang{transition:none!important}\n}\n', '')
          css.write_text(c, encoding='utf-8')

          # 3) Homepage has its own CSS block; patch separately, preserving CRLF.
          home = Path('index.html')
          b = home.read_bytes()
          b = b.replace(b'transition:transform .55s cubic-bezier(.22,.61,.36,1)!important;', b'transition:transform .72s cubic-bezier(.22,.61,.36,1)!important;')
          for block in (
              b'@media(prefers-reduced-motion:reduce){\r\n  .theme-yinyang{transition:none!important}\r\n}\r\n',
              b'@media(prefers-reduced-motion:reduce){\n  .theme-yinyang{transition:none!important}\n}\n',
          ):
              b = b.replace(block, b'')
          home.write_bytes(b)

          # Validation
          final_js = js.read_text(encoding='utf-8')
          if "if(!btn.querySelector('.theme-yinyang'))" not in final_js:
              raise SystemExit('JS preservation fix missing')
          if 'transition:transform .72s' not in css.read_text(encoding='utf-8'):
              raise SystemExit('Common animation duration missing')
          if b'transition:transform .72s' not in home.read_bytes():
              raise SystemExit('Homepage animation duration missing')

      - name: Show focused diff
        run: git diff -- js/site.js css/site-shell.css index.html

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-yinyang-animation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/site.js css/site-shell.css index.html .github/workflows/fix-yinyang-animation.yml
          git commit -m "Fix yin-yang theme toggle animation [skip ci]"
          git push
