name: Fix homepage yin-yang direct animation

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-home-yinyang-direct.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Patch homepage theme toggle animation
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          data = path.read_bytes()
          marker = b'homepage-yinyang-direct-animation-v1'
          if marker not in data:
              lines = [
                  '',
                  '/* homepage-yinyang-direct-animation-v1 */',
                  '#themeToggle .theme-yinyang{',
                  '  transform:translateY(-1px) rotate(0deg)!important;',
                  '  transform-origin:50% 50%!important;',
                  '  transition:transform .72s cubic-bezier(.22,.61,.36,1)!important;',
                  '}',
                  '#themeToggle[aria-pressed="true"] .theme-yinyang{',
                  '  transform:translateY(-1px) rotate(180deg)!important;',
                  '}',
                  ''
              ]
              nl = '\r\n' if b'\r\n' in data else '\n'
              encoded = nl.join(lines).encode('utf-8')
              pos = data.rfind(b'</style>')
              if pos < 0:
                  raise SystemExit('Closing style tag not found')
              path.write_bytes(data[:pos] + encoded + data[pos:])
          out = path.read_bytes()
          if out.count(marker) != 1:
              raise SystemExit('Homepage animation marker missing or duplicated')
          if b'#themeToggle[aria-pressed="true"] .theme-yinyang' not in out:
              raise SystemExit('Direct aria-pressed selector missing')

      - name: Show focused diff
        run: git diff -- index.html

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-home-yinyang-direct.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-home-yinyang-direct.yml
          git commit -m "UI: fix homepage yin-yang animation [skip ci]"
          git push
