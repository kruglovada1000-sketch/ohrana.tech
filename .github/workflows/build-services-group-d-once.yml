name: Build services group D once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-services-group-d-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate special service pages
        run: python scripts/build_services_group_d.py
      - name: Validate generated scope
        run: |
          test -f uslugi/ohrana-specialnyh-obektov/index.html
          test -f uslugi/ohrana-stroitelnyh-obektov/index.html
          test -f uslugi/ohrana-proizvodstvennyh-obektov/index.html
          test -f uslugi/ohrana-selskohozyaystvennyh-obektov/index.html
          test -f uslugi/ohrana-rynkov/index.html
          test -f uslugi/ohrana-aptek/index.html
          test -f uslugi/ohrana-fitnes-klubov-salonov/index.html
          test -f uslugi/ohrana-yaht-klubov/index.html
          test -f uslugi/ohrana-parkov-usadeb/index.html
          test -f uslugi/ohrana-pansionatov-sanatoriev/index.html
          grep -q '/uslugi/ohrana-specialnyh-obektov/' uslugi/index.html
          git status --short
          BAD=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(uslugi/index.html|uslugi/ohrana-specialnyh-obektov/|uslugi/ohrana-stroitelnyh-obektov/|uslugi/ohrana-proizvodstvennyh-obektov/|uslugi/ohrana-selskohozyaystvennyh-obektov/|uslugi/ohrana-rynkov/|uslugi/ohrana-aptek/|uslugi/ohrana-fitnes-klubov-salonov/|uslugi/ohrana-yaht-klubov/|uslugi/ohrana-parkov-usadeb/|uslugi/ohrana-pansionatov-sanatoriev/|sitemap.xml$)' || true)
          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uslugi/index.html uslugi/ohrana-specialnyh-obektov uslugi/ohrana-stroitelnyh-obektov uslugi/ohrana-proizvodstvennyh-obektov uslugi/ohrana-selskohozyaystvennyh-obektov uslugi/ohrana-rynkov uslugi/ohrana-aptek uslugi/ohrana-fitnes-klubov-salonov uslugi/ohrana-yaht-klubov uslugi/ohrana-parkov-usadeb uslugi/ohrana-pansionatov-sanatoriev sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Build services group D pages [skip ci]'
          git push origin main
