name: One-time armed guard tariff price patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-armed-guard-price-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply armed guard tariff correction
        run: python scripts/fix-armed-guard-price-once.py
      - name: Validate and commit
        run: |
          grep -F '<h3>Охрана с оружием</h3>' ceny/index.html
          grep -F 'от 450 000 ₽/смена' ceny/index.html
          grep -F '"price_from": 450000' site-src/pricing.json
          grep -F '"unit": "смена"' site-src/pricing.json
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ceny/index.html site-src/pricing.json
          git commit -m 'Correct armed guard tariff to 450000 per shift'
          git push origin HEAD:main
