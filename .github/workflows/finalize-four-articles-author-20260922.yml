name: Finalize four articles and author 2026-09-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-four-articles-author-20260922.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize author and validate article pages
        shell: python
        run: |
          from pathlib import Path
          import re, json

          files = [
              Path('stati/tehnicheskoe-zadanie-na-ohranu-obekta.html'),
              Path('stati/skolko-ohrannikov-nuzhno-na-obekt.html'),
              Path('stati/kak-kontrolirovat-rabotu-chop.html'),
              Path('stati/kak-smenit-chop-bez-razryva-ohrany.html'),
          ]

          author_block = '''<div class="author" data-reveal>
          <div class="author-ava">ПЖ</div>
          <div>
            <b>Пётр Жгун</b>
            <span>Эксперт по физической охране, ЧОО «Рускорпорация»</span>
          </div>
        </div>'''

          for p in files:
              s = p.read_text(encoding='utf-8')

              # Visible author card: one consistent expert attribution on every article.
              s, count = re.subn(
                  r'<div class="author" data-reveal>.*?</div>\s*</div>',
                  author_block,
                  s,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'Author block not replaced in {p}')

              # Article JSON-LD: author must be a Person, not an editorial organization.
              article_scripts = list(re.finditer(r'<script type="application/ld\+json">(.*?)</script>', s, re.S))
              replaced = False
              for m in article_scripts:
                  raw = m.group(1).strip()
                  try:
                      data = json.loads(raw)
                  except Exception:
                      continue
                  if data.get('@type') == 'Article':
                      data['author'] = {
                          '@type': 'Person',
                          'name': 'Пётр Жгун',
                          'jobTitle': 'Эксперт по физической охране',
                          'worksFor': {'@id': 'https://ohrana.tech/#organization'}
                      }
                      new_raw = json.dumps(data, ensure_ascii=False, separators=(',', ':'))
                      s = s[:m.start(1)] + new_raw + s[m.end(1):]
                      replaced = True
                      break
              if not replaced:
                  raise SystemExit(f'Article JSON-LD not found in {p}')

              # Production paths and required design/functionality checks.
              required = [
                  '<header class="site-header">',
                  '<section class="hero">',
                  '<div class="article-meta"',
                  '<div class="article-body">',
                  '<div class="toc">',
                  '<div class="form-box"',
                  'https://formspree.io/f/mvkpbvnb',
                  '<div class="cta-band"',
                  '<footer>',
                  '<div class="mbar"',
                  'id="chatPanel"',
                  'id="chatBtn"',
                  '/assets/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css',
                  '/assets/css/site-shell.css',
                  '/assets/js/site.js',
                  '/assets/js/article.js',
                  '<b>Пётр Жгун</b>',
                  'Эксперт по физической охране, ЧОО «Рускорпорация»',
                  '"@type":"Person"',
                  '"name":"Пётр Жгун"',
                  '</body>',
                  '</html>',
              ]
              for token in required:
                  if token not in s:
                      raise SystemExit(f'Missing {token!r} in {p}')

              # Reject the paths that previously broke the pages.
              bad = [
                  'href="/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css"',
                  'href="/css/site-shell.css"',
                  'src="/js/site.js"',
                  'src="/js/article.js"',
                  'Редакция «Рускорпорации»',
                  '"author":{"@type":"Organization"',
              ]
              for token in bad:
                  if token in s:
                      raise SystemExit(f'Bad token still present {token!r} in {p}')

              p.write_text(s, encoding='utf-8')

          print('Validated and finalized all four article pages')

      - name: Commit final article pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stati/tehnicheskoe-zadanie-na-ohranu-obekta.html \
                  stati/skolko-ohrannikov-nuzhno-na-obekt.html \
                  stati/kak-kontrolirovat-rabotu-chop.html \
                  stati/kak-smenit-chop-bez-razryva-ohrany.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: finalize four article pages and set Petr Zhgun as expert author"
          git push
