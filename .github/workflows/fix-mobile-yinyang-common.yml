name: Fix mobile yin-yang common styles

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-mobile-yinyang-common.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Match internal-page mobile yin-yang to homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path('css/site-shell.css')
          text = path.read_text(encoding='utf-8')
          marker = 'mobile-yinyang-match-home-v1'
          block = r'''
          /* mobile-yinyang-match-home-v1 */
          #themeToggle .theme-yinyang{
            transform:translateY(-1px) rotate(0deg)!important;
            transform-origin:50% 50%!important;
            transition:transform .72s cubic-bezier(.22,.61,.36,1)!important;
          }
          #themeToggle[aria-pressed="true"] .theme-yinyang{
            transform:translateY(-1px) rotate(180deg)!important;
          }
          @media(max-width:640px){
            #themeToggle{width:42px!important;height:42px!important;min-width:42px!important;flex:0 0 42px!important}
            #themeToggle .theme-yinyang{width:27px!important;height:27px!important}
          }
          @media(max-width:420px){
            #themeToggle .theme-yinyang{width:26px!important;height:26px!important}
          }
          '''
          if marker not in text:
              path.write_text(text.rstrip() + '\n\n' + block + '\n', encoding='utf-8')

          out = path.read_text(encoding='utf-8')
          if out.count(marker) != 1:
              raise SystemExit('Common mobile yin-yang marker missing or duplicated')
          if '#themeToggle[aria-pressed="true"] .theme-yinyang' not in out:
              raise SystemExit('aria-pressed rotation selector missing')

      - name: Show focused diff
        run: git diff -- css/site-shell.css

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/fix-mobile-yinyang-common.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/site-shell.css .github/workflows/fix-mobile-yinyang-common.yml
          git commit -m "UI: match mobile yin-yang to homepage [skip ci]"
          git push
