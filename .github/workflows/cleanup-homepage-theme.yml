name: Cleanup homepage theme

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-homepage-theme.yml"

permissions:
  contents: write

jobs:
  cleanup-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch homepage
        run: python scripts/cleanup_homepage_theme_once.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -F 'site-theme-yinyang-v3' index.html
          grep -F 'html[data-theme="light"] nav.nav .theme-toggle' index.html
          if grep -q 'theme-icon-sun\|theme-icon-moon\|site-theme-toggle-v1' index.html; then exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Clean homepage theme toggle zombies and improve contrast'
          git push origin HEAD:main
