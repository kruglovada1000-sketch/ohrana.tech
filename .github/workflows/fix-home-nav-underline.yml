name: Fix home nav underline

on:
  push:
    paths:
      - ".github/workflows/fix-home-nav-underline.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Align first nav underline with all other links
        shell: bash
        run: |
          patch_file() {
            file="$1"
            if ! grep -q 'nav-home-underline-alignment-v1' "$file"; then
              printf '\n/* nav-home-underline-alignment-v1 */\n@media(min-width:1101px){\n  nav.nav .wrap>a:first-child{padding-left:16px!important}\n  nav.nav .wrap>a:first-child::after{left:16px!important;right:16px!important;bottom:6px!important;height:1px!important}\n}\n' >> "$file"
            fi
          }
          patch_file css/site-shell.css
          patch_file assets/css/site-shell.css
          patch_file css/home-light-fix.css

      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/fix-home-nav-underline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/site-shell.css assets/css/site-shell.css css/home-light-fix.css .github/workflows/fix-home-nav-underline.yml
          git commit -m "UI: align Главная underline with navigation [skip ci]"
          git push
