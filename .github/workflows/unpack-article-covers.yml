name: Unpack article covers
on:
  push:
    paths:
      - 'article-covers.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack optimized article covers
        run: |
          mkdir -p images
          unzip -o article-covers.zip -d images
          rm article-covers.zip
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images article-covers.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 25 optimized article covers"
          git push