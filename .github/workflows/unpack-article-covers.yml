name: Build article covers
on:
  push:
    paths:
      - 'article-covers.ready'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Publish 25 optimized article covers
        run: |
          set -euo pipefail
          test -f article-covers-bundle.b64
          tr -d '\n\r' < article-covers-bundle.b64 | base64 -d -i > final25-covers.zip
          unzip -t final25-covers.zip >/dev/null
          rm -rf .article-covers-tmp
          mkdir -p .article-covers-tmp
          unzip -q -o final25-covers.zip -d .article-covers-tmp
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageOps
          from pathlib import Path

          src = Path('.article-covers-tmp')
          out = Path('images')
          files = sorted(src.glob('*.webp'))
          if len(files) != 25:
              raise SystemExit(f'Expected 25 covers, got {len(files)}')

          logo = Image.open('images/schit.png').convert('RGBA')
          for f in files:
              im = Image.open(f).convert('RGB').resize((480, 720), Image.Resampling.LANCZOS)
              draw = ImageDraw.Draw(im)
              x, y, w, h = 8, 8, 68, 78
              draw.rounded_rectangle((x, y, x+w, y+h), radius=10, fill=(5,7,10), outline=(202,163,77), width=1)
              lg = ImageOps.contain(logo, (56, 66), Image.Resampling.LANCZOS)
              px = x + (w-lg.width)//2
              py = y + (h-lg.height)//2
              im_rgba = im.convert('RGBA')
              im_rgba.alpha_composite(lg, (px, py))
              im_rgba.convert('RGB').save(out / f.name, 'WEBP', quality=82, method=6)

          if len(list(out.glob('stati-*.webp'))) < 25:
              raise SystemExit('Cover publish verification failed')
          PY
          rm -rf .article-covers-tmp final25-covers.zip article-covers-bundle.b64 article-covers.ready .article-cover-parts
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 25 article covers"
          git push
