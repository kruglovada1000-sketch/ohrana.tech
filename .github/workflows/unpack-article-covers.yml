name: Build article covers
on:
  push:
    paths:
      - 'article-covers-bundle.b64'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack 25 optimized article covers
        run: |
          set -euo pipefail
          base64 -d article-covers-bundle.b64 > article-covers.zip
          mkdir -p images
          unzip -o article-covers.zip -d images
          test "$(find images -maxdepth 1 -type f -name 'stati-*.webp' | grep -E 'stati-(nevyhod-smena|zapusk-ohrany|zamena-ohrannika|otvetstvennost-imushchestvo|dokumenty-choo|zhurnaly-posta|osmotr-imushchestva|zaderzhanie-narushitelya|konflikt-prohodnaya|dopusk-podryadchikov|poteryan-propusk|kontrol-transporta|pogruzka-razgruzka|starshiy-smeny|razdelenie-otvetstvennosti|avariynyy-rezhim|antiglushenie|lozhnye-trevogi|trevozhnaya-knopka|vremya-pribytiya-gbr|usilenie-ohrany|ohrana-remont-pereezd|dacha-zimoy|pik-skladskih-otgruzok|choo-vnevedomstvennaya)\.webp$' | wc -l)" -eq 25
          rm -f article-covers-bundle.b64 article-covers.zip
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 25 optimized article covers"
          git push
