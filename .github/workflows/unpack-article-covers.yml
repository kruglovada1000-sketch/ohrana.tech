name: Build article covers
on:
  push:
    paths:
      - 'article-covers.ready'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python -m pip install --quiet Pillow
      - name: Build 25 optimized article covers
        run: |
          set -euo pipefail
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          pairs = {
            'stati-nevyhod-smena.webp': 'images/fizicheskaya-ohrana.jpg',
            'stati-zapusk-ohrany.webp': 'images/ohrana-predpriyatij.jpg',
            'stati-zamena-ohrannika.webp': 'images/fizohrana-dva.jpg',
            'stati-otvetstvennost-imushchestvo.webp': 'images/vnutrennij-vor-sklad.jpg',
            'stati-dokumenty-choo.webp': 'images/foto-dogovor.jpg',
            'stati-zhurnaly-posta.webp': 'images/ohrannik-vahter-kontroler.webp',
            'stati-osmotr-imushchestva.webp': 'images/ohrana-magazina-2.jpg',
            'stati-zaderzhanie-narushitelya.webp': 'images/security-8.jpg',
            'stati-konflikt-prohodnaya.webp': 'images/ohrana-nochnyh-klubov.webp',
            'stati-dopusk-podryadchikov.webp': 'images/kontrol-dostupa-skud.webp',
            'stati-poteryan-propusk.webp': 'images/konsyerzh-servis.webp',
            'stati-kontrol-transporta.webp': 'images/ohrana-parkovok.jpg',
            'stati-pogruzka-razgruzka.webp': 'images/1ohrana-skladov.jpg',
            'stati-starshiy-smeny.webp': 'images/security-1.jpg',
            'stati-razdelenie-otvetstvennosti.webp': 'images/autsorsing-sluzhby-bezopasnosti.webp',
            'stati-avariynyy-rezhim.webp': 'images/security-system.jpg',
            'stati-antiglushenie.webp': 'images/pultovaya-ohrana.webp',
            'stati-lozhnye-trevogi.webp': 'images/motion-sensor.jpg',
            'stati-trevozhnaya-knopka.webp': 'images/tarif-pultovaya-ohrana-gbr.webp',
            'stati-vremya-pribytiya-gbr.webp': 'images/tarif-mobilnoe-patrulirovanie.webp',
            'stati-usilenie-ohrany.webp': 'images/nochnaya-ohrana.jpg',
            'stati-ohrana-remont-pereezd.webp': 'images/ohrana-strojki.jpg',
            'stati-dacha-zimoy.webp': 'images/ohrana-dach-kottedzhey.webp',
            'stati-pik-skladskih-otgruzok.webp': 'images/2ohrana-skladov.jpg',
            'stati-choo-vnevedomstvennaya.webp': 'images/chop-company.jpg',
          }

          logo = Image.open('images/schit.png').convert('RGBA')
          bbox = logo.getbbox()
          if bbox:
              logo = logo.crop(bbox)
          logo = ImageOps.contain(logo, (62, 72), Image.Resampling.LANCZOS)

          for name, source in pairs.items():
              path = Path(source)
              if not path.exists():
                  raise SystemExit(f'Missing source: {source}')
              im = Image.open(path).convert('RGB')
              # Vertical 2:3 cover; keep the visual centre safe for the accordion.
              im = ImageOps.fit(im, (480, 720), Image.Resampling.LANCZOS, centering=(0.5, 0.46))
              canvas = im.convert('RGBA')
              canvas.alpha_composite(logo, (12, 12))
              out = Path('images') / name
              q = 82
              while True:
                  canvas.convert('RGB').save(out, 'WEBP', quality=q, method=6)
                  if out.stat().st_size <= 200_000 or q <= 62:
                      break
                  q -= 4
              check = Image.open(out)
              if check.size != (480, 720):
                  raise SystemExit(f'Wrong size for {name}: {check.size}')
              if out.stat().st_size > 200_000:
                  raise SystemExit(f'Too large: {name} = {out.stat().st_size}')

          expected = set(pairs)
          missing = [n for n in sorted(expected) if not (Path('images') / n).exists()]
          if missing:
              raise SystemExit(f'Missing covers: {missing}')
          print('Published', len(expected), 'covers')
          PY
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/stati-*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish 25 optimized article covers"
          git push
