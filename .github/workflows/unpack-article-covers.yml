name: Unpack article covers
on:
  push:
    paths:
      - 'article-covers.ready'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and unpack optimized article covers
        run: |
          cat .article-cover-parts/part-* | base64 -d > article-covers.zip
          mkdir -p images
          unzip -o article-covers.zip -d images
          rm -f article-covers.zip article-covers.ready
          rm -rf .article-cover-parts
      - name: Commit covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add 25 optimized article covers"
          git push