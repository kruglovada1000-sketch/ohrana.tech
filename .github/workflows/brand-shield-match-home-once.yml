name: One-time brand shield match home

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/brand-shield-match-home-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shield size patch
        run: python scripts/brand-shield-match-home-once.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -F 'brand-shield-match-home-v1' assets/css/site-shell.css
          grep -F 'brand-shield-match-home-v1' site-src/assets/site-shell.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/site-shell.css site-src/assets/site-shell.css
          git commit -m 'Match header shield size to homepage'
          git push origin HEAD:main
# retry after formatting check fix
