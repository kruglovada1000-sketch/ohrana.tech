name: Build services group B once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-services-group-b-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate residential service pages
        run: python scripts/build_services_group_b.py
      - name: Validate generated scope
        run: |
          test -f uslugi/ohrana-zhiloy-nedvizhimosti/index.html
          test -f uslugi/ohrana-zhk-tszh/index.html
          test -f uslugi/ohrana-kottedzhnyh-poselkov/index.html
          test -f uslugi/ohrana-dach-kottedzhey/index.html
          test -f uslugi/ohrana-garazhey/index.html
          test -f uslugi/ohrana-parkovok/index.html
          git status --short
          BAD=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(uslugi/index.html|uslugi/ohrana-zhiloy-nedvizhimosti/|uslugi/ohrana-zhk-tszh/|uslugi/ohrana-kottedzhnyh-poselkov/|uslugi/ohrana-dach-kottedzhey/|uslugi/ohrana-garazhey/|uslugi/ohrana-parkovok/|sitemap.xml$)' || true)
          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uslugi/index.html uslugi/ohrana-zhiloy-nedvizhimosti uslugi/ohrana-zhk-tszh uslugi/ohrana-kottedzhnyh-poselkov uslugi/ohrana-dach-kottedzhey uslugi/ohrana-garazhey uslugi/ohrana-parkovok sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Build services group B pages [skip ci]'
          git push origin main
