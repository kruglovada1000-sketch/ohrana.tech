name: Fix predeploy findings

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-predeploy-findings.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        run: python3 scripts/fix_predeploy_findings.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ceny/index.html site-src/pricing.json css/site-shell.css site-src/assets/site-shell.css css/service-pages.css
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Fix predeploy image and mobile overflow issues [skip ci]"
            git push origin main
          fi
