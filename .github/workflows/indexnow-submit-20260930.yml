name: Submit urgent updates to Yandex IndexNow

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/indexnow-submit-20260930.yml'

permissions:
  contents: write

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify key and submit URLs
        shell: bash
        run: |
          set -euo pipefail
          KEY='z5UbbrF9HXWwxrSN1zpqdLYKwGH3cYV0'
          KEY_URL="https://ohrana.tech/${KEY}.txt"

          echo "Checking live IndexNow key: $KEY_URL"
          ok=0
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsSL --max-time 20 "$KEY_URL" || true)"
            if [ "$body" = "$KEY" ]; then
              echo "INDEXNOW_KEY_OK attempt=$i"
              ok=1
              break
            fi
            echo "Key not propagated yet (attempt $i); got: ${body:0:80}"
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "IndexNow key verification failed"
            exit 1
          fi

          cat > /tmp/indexnow.json <<'JSON'
          {
            "host": "ohrana.tech",
            "key": "z5UbbrF9HXWwxrSN1zpqdLYKwGH3cYV0",
            "keyLocation": "https://ohrana.tech/z5UbbrF9HXWwxrSN1zpqdLYKwGH3cYV0.txt",
            "urlList": [
              "https://ohrana.tech/",
              "https://ohrana.tech/fizicheskaya-ohrana/",
              "https://ohrana.tech/ohrana-pult/",
              "https://ohrana.tech/ohrana-meropriyatiy/",
              "https://ohrana.tech/ohrana-meropriyatiy-v-moskve/",
              "https://ohrana.tech/ceny/",
              "https://ohrana.tech/kompleksnaja-ohrana/",
              "https://ohrana.tech/stati/nochnaya-ohrana.html",
              "https://ohrana.tech/stati/ohrana-meropriyatiy-v-moskve.html",
              "https://ohrana.tech/soprovozhdenie-gruzov/",
              "https://ohrana.tech/stati/ohrana-restoranov.html",
              "https://ohrana.tech/stati/ohrana-restoranov/",
              "https://ohrana.tech/stati/ohrana-yuvelirnyh-magazinov/",
              "https://ohrana.tech/stati/ohrana-yuvelirnyh-magazinov.html",
              "https://ohrana.tech/stati/ohrana-uvelirnyh-magazinovinexistent/",
              "https://ohrana.tech/stati/ohrana-uvelirnyh-magazinov/",
              "https://ohrana.tech/uslugi/ohrana-skladov/",
              "https://ohrana.tech/uslugi/ohrana-magazinov/",
              "https://ohrana.tech/uslugi/ohrana-ofisov/",
              "https://ohrana.tech/uslugi/ohrana-torgovyh-centrov/",
              "https://ohrana.tech/uslugi/ohrana-biznes-centrov/",
              "https://ohrana.tech/uslugi/ohrana-gostinic/",
              "https://ohrana.tech/uslugi/ohrana-avtosalonov/",
              "https://ohrana.tech/uslugi/ohrana-restoranov/",
              "https://ohrana.tech/uslugi/ohrana-parkovok/",
              "https://ohrana.tech/uslugi/ohrana-stroitelnyh-obektov/"
            ]
          }
          JSON

          # Remove one accidental sentinel URL before submission and validate JSON.
          python3 - <<'PY'
          import json
          p='/tmp/indexnow.json'
          d=json.load(open(p,encoding='utf-8'))
          d['urlList']=[u for u in d['urlList'] if 'magazinovinexistent' not in u]
          assert len(d['urlList']) == len(set(d['urlList']))
          assert all(u.startswith('https://ohrana.tech/') for u in d['urlList'])
          json.dump(d,open(p,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('INDEXNOW_URL_COUNT',len(d['urlList']))
          PY

          code="$(curl -sS --max-time 30 -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            'https://yandex.com/indexnow')"
          echo "INDEXNOW_HTTP_STATUS=$code"
          echo "INDEXNOW_RESPONSE_BODY_BEGIN"
          cat /tmp/indexnow-response.txt || true
          echo
          echo "INDEXNOW_RESPONSE_BODY_END"

          case "$code" in
            200|202) echo "INDEXNOW_SUBMISSION_ACCEPTED" ;;
            *) echo "IndexNow submission failed with HTTP $code"; exit 1 ;;
          esac

      - name: Remove one-off workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/indexnow-submit-20260930.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Remove one-off IndexNow workflow"
          git push
