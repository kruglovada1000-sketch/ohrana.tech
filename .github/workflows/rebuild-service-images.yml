name: Rebuild service pages with existing images

on:
  push:
    paths:
      - '.github/workflows/rebuild-service-images.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Rebuild all service groups
        run: |
          python scripts/build_services_group_a.py
          python scripts/build_services_group_b.py
          python scripts/build_services_group_c.py
          python scripts/build_services_group_d.py
          python scripts/build_services_group_e.py
      - name: Commit generated service pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uslugi sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Apply existing images to service pages [skip ci]"
            git push origin main
          fi
