name: Fix visible aligned stats once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-aligned-stats-visible-once.yml'

permissions:
  contents: write

jobs:
  fix-visible-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fix visible values and license date
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          exts = {'.html', '.htm', '.js', '.json', '.txt', '.xml', '.yml'}
          changed=[]
          total=0

          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new=text
              count=0

              fixes=[
                  (r'(<b[^>]*data-value="5000"[^>]*>)\s*8[ \u00a0]?000\+?(\s*</b>)', r'\g<1>5 000+\2'),
                  (r'(<b[^>]*data-value="18"[^>]*>)\s*20(?:\+)?(\s*</b>\s*<span>[^<]{0,80}(?:лет|опыт))', r'\g<1>18\2'),
                  (r'<b>\s*с\s*2007\s*</b>(\s*<span>[^<]{0,80}(?:год|рынк|охран|опыт))', r'<b>с 2008</b>\1'),
                  (r'<b>\s*10–15\s*</b>(\s*<span>[^<]{0,100}(?:минут|ГБР|прибыт|реагир))', r'<b>5–10</b>\1'),
                  (r'<b>\s*10-15\s*</b>(\s*<span>[^<]{0,100}(?:минут|ГБР|прибыт|реагир))', r'<b>5-10</b>\1'),
              ]
              for pat,repl in fixes:
                  new,n=re.subn(pat,repl,new,flags=re.I)
                  count+=n

              # License date is a legal fact, not the team's experience start date.
              if p.as_posix()=='fizicheskaya-ohrana/index.html':
                  old='Работаем по действующей лицензии <span class="accent">№ Л056-00106-59/00033018</span> с 2008 года. Все разрешения и допуски подтверждены.'
                  repl='Работаем по действующей лицензии <span class="accent">№ Л056-00106-59/00033018</span> от 29.11.2018. Все разрешения и допуски подтверждены.'
                  n=new.count(old)
                  if n:
                      new=new.replace(old,repl)
                      count+=n

              if new!=text:
                  p.write_text(new,encoding='utf-8')
                  changed.append((str(p),count))
                  total+=count

          print(f'CHANGED_FILES={len(changed)}')
          print(f'REPLACEMENTS={total}')
          for name,count in changed:
              print(f'{count:3d}  {name}')
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/fix-aligned-stats-visible-once.yml
          if git diff --cached --quiet; then
            echo "No visible-stat fixes needed"
            exit 0
          fi
          git commit -m "Fix visible aligned stats and license date"
          git push
