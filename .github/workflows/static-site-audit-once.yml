name: One-time static site audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/static-site-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run static site audit
        run: python scripts/static-site-audit-once.py
