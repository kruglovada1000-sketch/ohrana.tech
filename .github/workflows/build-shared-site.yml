name: Build shared site templates

on:
  push:
    branches:
      - refactor/shared-site-template
    paths:
      - "site-src/**"
      - "scripts/**"
      - ".github/workflows/build-shared-site.yml"
  pull_request:
    branches:
      - main

concurrency:
  group: shared-site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit object migration candidates
        run: python scripts/audit_migration_candidates.py

      - name: Build static pages
        run: |
          python scripts/build_site.py
          python scripts/build_object_pages.py
          python scripts/build_custom_pages.py
          python scripts/normalize_generated_links.py
          python scripts/normalize_jsonld_entities.py
          python scripts/normalize_sitemap.py

      - name: Validate generated structure
        run: |
          python -m py_compile scripts/build_site.py scripts/build_object_pages.py scripts/build_custom_pages.py scripts/audit_migration_candidates.py scripts/normalize_generated_links.py scripts/normalize_jsonld_entities.py scripts/normalize_sitemap.py scripts/validate_shared_shell.py scripts/validate_custom_generated.py scripts/validate_sitemap.py scripts/validate_generated_html.py
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          manifest = json.loads(Path('site-src/object-pages.json').read_text(encoding='utf-8'))
          assert manifest, 'object page manifest is empty'
          slugs = ['ohrana-skladov'] + [page['slug'] for page in manifest]
          assert len(slugs) == len(set(slugs)), 'duplicate migrated slug'

          for slug in slugs:
              page = root / slug / 'index.html'
              css = root / 'assets' / 'css' / f'{slug}.css'
              assert page.exists(), page
              assert css.exists(), css
              html = page.read_text(encoding='utf-8')
              assert 'href="/ceny/"' in html, slug
              assert '<style' not in html.lower(), slug
              assert '{{site.' not in html, slug
              assert len(re.findall(r'<header\b', html, re.I)) == 1, slug
              assert len(re.findall(r'<main\b', html, re.I)) == 1, slug
              assert len(re.findall(r'<footer\b', html, re.I)) == 1, slug
              assert f'/assets/css/{slug}.css' in html, slug
              assert html.index(f'/assets/css/{slug}.css') < html.index('/assets/css/site-shell.css'), slug

          custom = json.loads(Path('site-src/custom-pages.json').read_text(encoding='utf-8'))
          custom_slugs = [page['slug'] for page in custom]
          assert len(custom_slugs) == len(set(custom_slugs)), 'duplicate custom slug'
          assert not set(slugs).intersection(custom_slugs), 'page present in regular and custom manifests'

          prices = Path('ceny/index.html').read_text(encoding='utf-8')
          assert 'href="/ceny/"' in prices
          assert '<style' not in prices.lower()
          assert '{{site.' not in prices
          assert 'https://ohrana.tech/ceny/' in Path('sitemap.xml').read_text(encoding='utf-8')
          assert '/stati/soprovozhdenie-gruzov.html' in prices
          assert "</filter id='n'>" not in Path('assets/css/site-shell.css').read_text(encoding='utf-8')
          print(f'Generated structure OK: {len(slugs)} regular object pages + {len(custom_slugs)} custom pages + prices')
          PY

      - name: Validate shared design shell
        run: python scripts/validate_shared_shell.py

      - name: Validate custom interactive pages
        run: python scripts/validate_custom_generated.py

      - name: Validate warehouse content markers
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('ohrana-skladov/index.html').read_text(encoding='utf-8')
          for marker in ['id="risks"','id="services"','id="types"','id="prices"','id="steps"','id="why"','id="faq"','id="articles"','id="cta"']:
              assert marker in html, marker
          print('Warehouse unique content markers OK')
          PY

      - name: Validate HTML integrity, JSON-LD and internal links
        run: python scripts/validate_generated_html.py

      - name: Validate sitemap targets
        run: python scripts/validate_sitemap.py

      - name: Commit generated files on refactor branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/refactor/shared-site-template' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "Generated files are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          regular = json.loads(Path('site-src/object-pages.json').read_text(encoding='utf-8'))
          custom = json.loads(Path('site-src/custom-pages.json').read_text(encoding='utf-8'))
          paths = [
              'ohrana-skladov/index.html',
              'ceny/index.html',
              'sitemap.xml',
              'assets/css',
              'assets/js',
          ]
          paths.extend(f"{page['slug']}/index.html" for page in regular)
          paths.extend(f"{page['slug']}/index.html" for page in custom)
          subprocess.run(['git', 'add', '--', *paths], check=True)
          PY
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "build: regenerate shared site batch [skip ci]"
          if git push; then
            exit 0
          fi
          git fetch origin refactor/shared-site-template
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/refactor/shared-site-template)" ]; then
            echo "Generated commit is already present on remote"
            exit 0
          fi
          echo "Remote branch moved to a different commit; refusing to force-push"
          exit 1
