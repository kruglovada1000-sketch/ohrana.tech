name: Restore article design 2026-09-22

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-article-design-20260922.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore article template asset paths and meta icons
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('stati/tehnicheskoe-zadanie-na-ohranu-obekta.html'),
              Path('stati/skolko-ohrannikov-nuzhno-na-obekt.html'),
              Path('stati/kak-kontrolirovat-rabotu-chop.html'),
              Path('stati/kak-smenit-chop-bez-razryva-ohrany.html'),
          ]

          calendar = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'
          clock = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>'
          shield = '<svg viewBox="0 0 24 24"><path d="M12 2 4 5.5v5.2c0 4.9 3.4 9.5 8 10.8 4.6-1.3 8-5.9 8-10.8V5.5L12 2Z"/></svg>'

          for path in files:
              text = path.read_text(encoding='utf-8')

              # Restore the established article-design asset locations used by the live template.
              text = text.replace('href="/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css"', 'href="/assets/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css"')
              text = text.replace('href="/css/site-shell.css"', 'href="/assets/css/site-shell.css"')
              text = text.replace('src="/js/site.js"', 'src="/assets/js/site.js"')
              text = text.replace('src="/js/article.js"', 'src="/assets/js/article.js"')

              # Match the original article hero: icon chips for date, reading time and verification/type.
              pattern = re.compile(
                  r'<div class="article-meta" data-reveal>\s*'
                  r'<span>(?!<svg)(.*?)</span>\s*'
                  r'<span>(?!<svg)(.*?)</span>\s*'
                  r'<span>(?!<svg)(.*?)</span>\s*'
                  r'</div>',
                  re.S,
              )
              def repl(m):
                  return (
                      '<div class="article-meta" data-reveal>'
                      f'<span>{calendar}{m.group(1).strip()}</span>'
                      f'<span>{clock}{m.group(2).strip()}</span>'
                      f'<span>{shield}{m.group(3).strip()}</span>'
                      '</div>'
                  )
              text = pattern.sub(repl, text, count=1)

              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate restored article shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('stati/tehnicheskoe-zadanie-na-ohranu-obekta.html'),
              Path('stati/skolko-ohrannikov-nuzhno-na-obekt.html'),
              Path('stati/kak-kontrolirovat-rabotu-chop.html'),
              Path('stati/kak-smenit-chop-bez-razryva-ohrany.html'),
          ]
          required = [
              '/assets/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css',
              '/assets/css/site-shell.css',
              '/assets/js/site.js',
              '/assets/js/article.js',
              'class="hero"',
              'class="shield-box"',
              'class="article-layout"',
              'class="article-body"',
              'class="cta-band"',
          ]
          for path in files:
              text = path.read_text(encoding='utf-8')
              missing = [x for x in required if x not in text]
              if missing:
                  raise SystemExit(f'{path}: missing {missing}')
              if text.count('<svg viewBox="0 0 24 24">') < 3:
                  raise SystemExit(f'{path}: article meta icons were not restored')
          print('Article design shell restored and validated for all four pages.')
          PY

      - name: Commit restored pages
        shell: bash
        run: |
          if git diff --quiet -- stati/*.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stati/tehnicheskoe-zadanie-na-ohranu-obekta.html \
                  stati/skolko-ohrannikov-nuzhno-na-obekt.html \
                  stati/kak-kontrolirovat-rabotu-chop.html \
                  stati/kak-smenit-chop-bez-razryva-ohrany.html
          git commit -m 'fix: restore full article page design'
          git push
