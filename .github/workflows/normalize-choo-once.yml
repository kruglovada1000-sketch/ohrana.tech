name: Restore CHOO runtime fallback mappings once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-choo-once.yml'

permissions:
  contents: write

jobs:
  restore-runtime-fallback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Restore old-to-new fallback pairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          fixes = [
              ("['ООО ЧОО «Рускорпорация охрана и консалтинг»','ООО ЧОО «Рускорпорация охрана и консалтинг»']", "['ООО ЧОП «Рускорпорация охрана и консалтинг»','ООО ЧОО «Рускорпорация охрана и консалтинг»']"),
              ("['ООО ЧОО «Рускорпорация»','ООО ЧОО «Рускорпорация»']", "['ООО ЧОП «Рускорпорация»','ООО ЧОО «Рускорпорация»']"),
              ("['ЧОО Рускорпорация','ЧОО Рускорпорация']", "['ЧОП Рускорпорация','ЧОО Рускорпорация']"),
              ("['Лицензированное ЧОО — профессиональная охрана','Лицензированное ЧОО — профессиональная охрана']", "['Лицензированное ЧОП — профессиональная охрана','Лицензированное ЧОО — профессиональная охрана']"),
          ]
          for name in ('js/site.js','assets/js/site.js'):
              p = Path(name)
              if not p.exists():
                  continue
              text = p.read_text(encoding='utf-8')
              new = text
              for old, repl in fixes:
                  new = new.replace(old, repl)
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  print('FIXED', name)
          PY
      - name: Commit fallback repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/site.js assets/js/site.js
          if git diff --cached --quiet; then
            echo "No fallback repair needed"
            exit 0
          fi
          git commit -m "Restore CHOO naming fallback mappings"
          git push
