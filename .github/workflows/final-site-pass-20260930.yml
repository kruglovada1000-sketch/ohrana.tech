name: Final one-pass site cleanup 2026-09-30
on:
  push:
    paths:
      - '.github/workflows/final-site-pass-20260930.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply final site-wide fixes and audit
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          from collections import defaultdict

          changed=set(); report=[]
          def save(p, old, new):
              if new!=old:
                  p.write_text(new,encoding='utf-8'); changed.add(str(p))

          html_files=[p for p in Path('.').rglob('*.html') if '.git' not in p.parts]
          exact={
              'ООО ЧОП «Рускорпорация»':'ООО ЧОО «Рускорпорация»',
              'ЧОП «Рускорпорация»':'ЧОО «Рускорпорация»',
              'ООО ЧОП "Рускорпорация"':'ООО ЧОО "Рускорпорация"',
              'ЧОП "Рускорпорация"':'ЧОО "Рускорпорация"',
              'Лицензированное частное охранное предприятие «Рускорпорация»':'Лицензированная частная охранная организация «Рускорпорация»',
              'лицензированное частное охранное предприятие «Рускорпорация»':'лицензированная частная охранная организация «Рускорпорация»',
          }

          for p in html_files:
              s=p.read_text(encoding='utf-8'); n=s
              for a,b in exact.items(): n=n.replace(a,b)
              # Correct company GБР timing in any textual form: 5-10 -> 10-15, only close to the token GБР.
              n=re.sub(r'(ГБР(?:(?!<).){0,50}?)(5\s*[–—-]\s*10)(?=\s*(?:мин|минут))', lambda m:m.group(1)+'10–15', n, flags=re.I)
              n=re.sub(r'(ГБР(?:(?!<).){0,50}?)(5\s*[–—-]\s*10)(?=\s*(?:мин|минут))', lambda m:m.group(1)+'10–15', n, flags=re.I)
              # Raw HTML counters must show their real target value, not zero.
              n=re.sub(r'(<(?:b|span|strong)[^>]*\bdata-(?:target|count)=["\'])(\d+)(["\'][^>]*>)0(?=\s*</(?:b|span|strong)>)', lambda m:m.group(1)+m.group(2)+m.group(3), n, flags=re.I)
              save(p,s,n)

          # Event pages: 4,000 RUB/hour per one guard.
          for p in [Path('ohrana-meropriyatiy/index.html'),Path('ohrana-meropriyatiy-v-moskve/index.html')]:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8'); n=s
              n=re.sub(r'от\s+(?:8|10|12|14|15|18|20)\s*000\s*₽\s*/\s*смен[ау]', 'от 4 000 ₽/час', n, flags=re.I)
              n=re.sub(r'(?:8|10|12|14|15|18|20)\s*000\s*₽\s*/\s*смен[ау]', '4 000 ₽/час', n, flags=re.I)
              n=re.sub(r'("minPrice"\s*:\s*")(?:8000|10000|12000|14000|15000|18000|20000)("\s*,\s*"priceCurrency"\s*:\s*"RUB"\s*,\s*"unitText"\s*:\s*")(?:смена|час)(")', r'\g<1>4000\g<2>час за 1 охранника\g<3>', n)
              n=re.sub(r'(Стандарт[^<]{0,100}</span>\s*<b>)от\s*[\d\s]+₽[^<]*(</b>)', r'\1от 4 000 ₽/час\2', n, flags=re.I)
              n=re.sub(r'(Премиум[^<]{0,100}</span>\s*<b>)от\s*[\d\s]+₽[^<]*(</b>)', r'\1от 4 000 ₽/час\2', n, flags=re.I)
              n=re.sub(r'(VIP[^<]{0,100}</span>\s*<b>)от\s*[\d\s]+₽[^<]*(</b>)', r'\1от 4 000 ₽/час\2', n, flags=re.I)
              save(p,s,n)

          # Price catalogue structured data guardrail.
          p=Path('ceny/index.html')
          if p.exists():
              s=p.read_text(encoding='utf-8'); n=s
              def fix_event_offer(m):
                  b=m.group(0)
                  b=re.sub(r'"minPrice"\s*:\s*"\d+"','"minPrice":"4000"',b)
                  b=re.sub(r'"unitText"\s*:\s*"[^"]+"','"unitText":"час за 1 охранника"',b)
                  return b
              n=re.sub(r'\{"@type":"Offer","name":"Охрана мероприятия[^}]+\}\}',fix_event_offer,n)
              save(p,s,n)

          # Sitemap cleanup: remove local redirect stubs and duplicates; keep canonical destinations only.
          sp=Path('sitemap.xml')
          if sp.exists():
              ss=sp.read_text(encoding='utf-8'); rt=ET.fromstring(ss); tree=ET.ElementTree(rt)
              ns=rt.tag.split('}')[0]+'}' if rt.tag.startswith('{') else ''
              stubs=set()
              for p in html_files:
                  txt=p.read_text(encoding='utf-8').lower()
                  if 'http-equiv="refresh"' in txt and '<link rel="canonical"' in txt:
                      rel='/' if str(p)=='index.html' else ('/'+str(p.parent).replace('\\','/')+'/' if p.name=='index.html' else '/'+str(p).replace('\\','/'))
                      stubs.add('https://ohrana.tech'+rel)
              seen=set(); removed=[]
              for u in list(rt.findall(ns+'url')):
                  loc=u.find(ns+'loc'); url=(loc.text or '').strip() if loc is not None else ''
                  if url and (url in seen or url in stubs): removed.append(url); rt.remove(u)
                  elif url: seen.add(url)
              if removed:
                  ET.indent(tree,space='  '); tree.write(sp,encoding='unicode',xml_declaration=True); changed.add(str(sp))
              report.append('Sitemap URLs: '+str(len(seen))+'; removed redirects/duplicates: '+str(len(removed)))

          # Audit remaining SEO structure. These lists are printed for manual review; critical consistency must be zero.
          missing=[]; noindex=[]; h1bad=[]; stale=[]; zeros=[]; chop=[]; cmap=defaultdict(list)
          for p in html_files:
              txt=p.read_text(encoding='utf-8'); low=txt.lower()
              cans=re.findall(r'<link\s+rel=["\']canonical["\']\s+href=["\']([^"\']+)',txt,re.I)
              if cans:
                  for c in cans: cmap[c].append(str(p))
              elif '<head' in low and 'http-equiv="refresh"' not in low and p.name!='404.html': missing.append(str(p))
              if re.search(r'<meta[^>]+name=["\']robots["\'][^>]+content=["\'][^"\']*noindex',txt,re.I): noindex.append(str(p))
              hc=len(re.findall(r'<h1\b',txt,re.I))
              if hc!=1 and 'http-equiv="refresh"' not in low and p.name!='404.html': h1bad.append((str(p),hc))
              if re.search(r'ГБР(?:(?!<).){0,50}?5\s*[–—-]\s*10\s*(?:мин|минут)',txt,re.I): stale.append(str(p))
              if re.search(r'data-(?:target|count)=["\']\d+["\'][^>]*>\s*0\s*<',txt,re.I): zeros.append(str(p))
              if 'ЧОП «Рускорпорация»' in txt or 'ООО ЧОП «Рускорпорация»' in txt: chop.append(str(p))
          dups={k:v for k,v in cmap.items() if len(v)>1}
          print('FINAL_AUDIT HTML',len(html_files))
          print('FINAL_AUDIT missing canonical',missing)
          print('FINAL_AUDIT noindex',noindex)
          print('FINAL_AUDIT H1 count != 1',h1bad)
          print('FINAL_AUDIT duplicate canonicals',dups)
          print('FINAL_AUDIT stale GБР',stale)
          print('FINAL_AUDIT zero stats',zeros)
          print('FINAL_AUDIT company ЧОП',chop)
          print('CHANGED_FILES',sorted(changed))
          if stale or zeros or chop:
              raise SystemExit('Critical consistency checks still fail')
          PY
      - name: Commit final package and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/final-site-pass-20260930.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No final changes needed"
            exit 0
          fi
          git commit -m "Final one-pass site cleanup before manual hosting upload"
          git push
