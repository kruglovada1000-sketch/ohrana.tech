name: Build services group A once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-services-group-a-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Generate commercial service pages
        run: python scripts/build_services_group_a.py
      - name: Validate generated scope
        run: |
          test -f uslugi/ohrana-kommercheskih-obektov/index.html
          test -f uslugi/ohrana-bankov/index.html
          test -f uslugi/ohrana-bukmekerskih-kontor/index.html
          git status --short
          BAD=$(git status --porcelain | awk '{print $2}' | grep -Ev '^(uslugi/|sitemap.xml$)' || true)
          if [ -n "$BAD" ]; then
            echo "Unexpected files changed:"
            echo "$BAD"
            exit 1
          fi
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uslugi sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes'
            exit 0
          fi
          git commit -m 'Build services group A pages [skip ci]'
          git push origin main
