name: Align ohrana.tech stats with ruscor24 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-ruscor24-stats-once.yml'

permissions:
  contents: write

jobs:
  align-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Align company statistics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          exts = {'.html', '.htm', '.js', '.json', '.txt', '.xml', '.yml'}
          changed = []
          total = 0

          def subn(pattern, repl, text, flags=0):
              return re.subn(pattern, repl, text, flags=flags)

          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue

              new = text
              count = 0

              # Objects under protection: only when the number is explicitly tied to objects.
              patterns = [
                  (r'data-value="8000"(?=[^>]*>\s*8[ \u00a0]?000\+?\s*</b>\s*<span>[^<]{0,80}(?:охраняем|объект))', 'data-value="5000"'),
                  (r'8[ \u00a0]?000\+(?=[^\n<]{0,120}(?:охраняем|объект))', '5 000+'),
                  (r'8[ \u00a0]?000(?=[^\n<]{0,120}(?:охраняем|объект))', '5 000'),
                  (r'8000\+(?=[^\n<]{0,120}(?:охраняем|объект))', '5000+'),
                  (r'8000(?=[^\n<]{0,120}(?:охраняем|объект))', '5000'),
              ]
              for pat, repl in patterns:
                  new, n = subn(pat, repl, new, flags=re.I)
                  count += n

              # Experience: align visible company statistics to 18 years / since 2008.
              patterns = [
                  (r'data-value="20"(?=[^>]*>\s*20\s*</b>\s*<span>[^<]{0,80}(?:лет|опыт))', 'data-value="18"'),
                  (r'20\s*лет(?=[^\n<]{0,100}(?:опыт|рынк|охран|безопас))', '18 лет'),
                  (r'20\+\s*лет(?=[^\n<]{0,100}(?:опыт|рынк|охран|безопас))', '18 лет'),
                  (r'с\s*2007(?=[^\n<]{0,100}(?:год|рынк|охран|безопас|опыт))', 'с 2008'),
              ]
              for pat, repl in patterns:
                  new, n = subn(pat, repl, new, flags=re.I)
                  count += n

              # GБР / response time: only when 10–15 minutes is tied to arrival or response.
              patterns = [
                  (r'10–15(?=[^\n<]{0,100}(?:минут|мин\.|ГБР|прибыт|реагир))', '5–10'),
                  (r'10-15(?=[^\n<]{0,100}(?:минут|мин\.|ГБР|прибыт|реагир))', '5-10'),
              ]
              for pat, repl in patterns:
                  new, n = subn(pat, repl, new, flags=re.I)
                  count += n

              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append((str(p), count))
                  total += count

          print(f'CHANGED_FILES={len(changed)}')
          print(f'REPLACEMENTS={total}')
          for name, count in changed:
              print(f'{count:3d}  {name}')
          PY

      - name: Commit aligned statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- .github/workflows/align-ruscor24-stats-once.yml
          if git diff --cached --quiet; then
            echo "No statistic changes needed"
            exit 0
          fi
          git commit -m "Align site statistics with ruscor24"
          git push
