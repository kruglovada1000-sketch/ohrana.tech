name: Restore 25 new articles

on:
  push:
    paths:
      - '.github/workflows/restore-new25-articles.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify and normalize 25 articles
        shell: python
        run: |
          from pathlib import Path
          import re

          articles = [
            ('chto-delat-esli-ohrannik-ne-vyshel-na-smenu','stati-nevyhod-smena.webp'),
            ('srok-zapuska-ohrany-novogo-obekta','stati-zapusk-ohrany.webp'),
            ('zamena-ohrannika-po-trebovaniyu-zakazchika','stati-zamena-ohrannika.webp'),
            ('otvetstvennost-choo-za-propazhu-imushchestva','stati-otvetstvennost-imushchestvo.webp'),
            ('dokumenty-choo-do-nachala-ohrany','stati-dokumenty-choo.webp'),
            ('zhurnaly-i-dokumenty-na-postu-ohrany','stati-zhurnaly-posta.webp'),
            ('imeet-li-ohrannik-pravo-osmatrivat-sumki-avtomobil','stati-osmotr-imushchestva.webp'),
            ('mozhet-li-chastnyy-ohrannik-zaderzhat-narushitelya','stati-zaderzhanie-narushitelya.webp'),
            ('posetitel-otkazyvaetsya-soblyudat-propusknoy-rezhim','stati-konflikt-prohodnaya.webp'),
            ('dopusk-podryadchikov-kurerov-vremennyh-rabotnikov','stati-dopusk-podryadchikov.webp'),
            ('poteryan-propusk-klyuch-karta-dostupa','stati-poteryan-propusk.webp'),
            ('kontrol-vezda-vyezda-transporta','stati-kontrol-transporta.webp'),
            ('ohrana-pogruzki-i-razgruzki','stati-pogruzka-razgruzka.webp'),
            ('kogda-nuzhen-starshiy-smeny-ohrany','stati-starshiy-smeny.webp'),
            ('otvetstvennost-choo-i-sluzhby-bezopasnosti-zakazchika','stati-razdelenie-otvetstvennosti.webp'),
            ('ohrana-pri-otklyuchenii-elektrichestva-interneta-skud','stati-avariynyy-rezhim.webp'),
            ('zashchita-ohrannoy-signalizacii-ot-glusheniya','stati-antiglushenie.webp'),
            ('kak-umenshit-lozhnye-trevogi','stati-lozhnye-trevogi.webp'),
            ('nuzhna-li-trevozhnaya-knopka-esli-est-kamery','stati-trevozhnaya-knopka.webp'),
            ('kak-bystro-dolzhna-priehat-gbr','stati-vremya-pribytiya-gbr.webp'),
            ('usilenie-ohrany-nochyu-vyhodnye-prazdniki','stati-usilenie-ohrany.webp'),
            ('ohrana-obekta-vo-vremya-remonta-pereezda','stati-ohrana-remont-pereezd.webp'),
            ('kak-zashchitit-dachu-zimoy','stati-dacha-zimoy.webp'),
            ('kak-usilit-ohranu-sklada-v-pikovyy-sezon','stati-pik-skladskih-otgruzok.webp'),
            ('chop-choo-vnevedomstvennaya-ohrana-raznica','stati-choo-vnevedomstvennaya.webp'),
          ]

          index = Path('stati/index.html')
          if not index.exists():
              raise SystemExit('Missing stati/index.html')
          index_text = index.read_text(encoding='utf-8')

          missing = []
          changed = []
          for slug, image in articles:
              html_path = Path('stati') / f'{slug}.html'
              image_path = Path('images') / image
              if not html_path.exists(): missing.append(str(html_path))
              if not image_path.exists(): missing.append(str(image_path))
              if slug not in index_text: missing.append(f'index card: {slug}')
              if not html_path.exists():
                  continue
              text = html_path.read_text(encoding='utf-8')
              # Normalize the author everywhere without changing article design.
              text2 = re.sub(r'"author"\s*:\s*\{[^{}]*?"@type"\s*:\s*"Person"[^{}]*?\}',
                             '"author":{"@type":"Person","name":"Пётр Жгун","jobTitle":"Эксперт по физической охране"}',
                             text, count=1)
              if '"author"' not in text2 and '"publisher"' in text2:
                  text2 = text2.replace('"publisher"', '"author":{"@type":"Person","name":"Пётр Жгун","jobTitle":"Эксперт по физической охране"},"publisher"', 1)
              if '<div class="author">' in text2:
                  block_start = text2.find('<div class="author">')
                  block_end = text2.find('</div></div>', block_start)
                  if block_end != -1:
                      block_end += len('</div></div>')
                      block = text2[block_start:block_end]
                      block = re.sub(r'<b>.*?</b>', '<b>Пётр Жгун</b>', block, count=1, flags=re.S)
                      text2 = text2[:block_start] + block + text2[block_end:]
              elif '<div class="article-body">' in text2:
                  author = '<div class="author"><div class="author-ava">ПЖ</div><div><b>Пётр Жгун</b><span>Эксперт по физической охране, ЧОО «Рускорпорация»</span></div></div>'
                  text2 = text2.replace('<div class="article-body">', author + '<div class="article-body">', 1)
              if 'Пётр Жгун' not in text2:
                  missing.append(f'author: {html_path}')
              if f'/images/{image}' not in text2:
                  missing.append(f'image reference: {html_path}')
              if text2 != text:
                  html_path.write_text(text2, encoding='utf-8')
                  changed.append(str(html_path))

          if missing:
              raise SystemExit('RESTORE AUDIT FAILED:\n' + '\n'.join(missing))

          # Static HTML is the source of truth. Do not inject the same 25 cards a second time in JS.
          js = Path('assets/js/stati.js')
          js_text = js.read_text(encoding='utf-8')
          if 'var fresh=[' in js_text and 'var items=' in js_text:
              a = js_text.index('var fresh=[')
              b = js_text.index('var items=', a)
              js_text = js_text[:a] + "/* new25 cards are rendered statically in stati/index.html for SEO and no-JS resilience */\n" + js_text[b:]
              js.write_text(js_text, encoding='utf-8')
              changed.append(str(js))

          print(f'OK: {len(articles)} article pages, {len(articles)} images, 25 index cards, author Пётр Жгун')
          print('Changed:', ', '.join(changed) if changed else 'none')

      - name: Build FileZilla restoration bundle
        run: |
          set -e
          rm -rf restore-25
          mkdir -p restore-25/stati restore-25/images restore-25/assets/js restore-25/assets/css/articles restore-25/assets/css
          cp stati/index.html restore-25/stati/index.html
          cp assets/js/stati.js restore-25/assets/js/stati.js
          cp assets/js/site.js restore-25/assets/js/site.js
          cp assets/js/article.js restore-25/assets/js/article.js
          cp assets/css/stati.css restore-25/assets/css/stati.css
          cp assets/css/site-shell.css restore-25/assets/css/site-shell.css
          cp assets/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css restore-25/assets/css/articles/kak-vybrat-chop-dlya-ohrany-obekta.css
          python - <<'PY'
          from pathlib import Path
          pairs = [
          ('chto-delat-esli-ohrannik-ne-vyshel-na-smenu','stati-nevyhod-smena.webp'),('srok-zapuska-ohrany-novogo-obekta','stati-zapusk-ohrany.webp'),('zamena-ohrannika-po-trebovaniyu-zakazchika','stati-zamena-ohrannika.webp'),('otvetstvennost-choo-za-propazhu-imushchestva','stati-otvetstvennost-imushchestvo.webp'),('dokumenty-choo-do-nachala-ohrany','stati-dokumenty-choo.webp'),('zhurnaly-i-dokumenty-na-postu-ohrany','stati-zhurnaly-posta.webp'),('imeet-li-ohrannik-pravo-osmatrivat-sumki-avtomobil','stati-osmotr-imushchestva.webp'),('mozhet-li-chastnyy-ohrannik-zaderzhat-narushitelya','stati-zaderzhanie-narushitelya.webp'),('posetitel-otkazyvaetsya-soblyudat-propusknoy-rezhim','stati-konflikt-prohodnaya.webp'),('dopusk-podryadchikov-kurerov-vremennyh-rabotnikov','stati-dopusk-podryadchikov.webp'),('poteryan-propusk-klyuch-karta-dostupa','stati-poteryan-propusk.webp'),('kontrol-vezda-vyezda-transporta','stati-kontrol-transporta.webp'),('ohrana-pogruzki-i-razgruzki','stati-pogruzka-razgruzka.webp'),('kogda-nuzhen-starshiy-smeny-ohrany','stati-starshiy-smeny.webp'),('otvetstvennost-choo-i-sluzhby-bezopasnosti-zakazchika','stati-razdelenie-otvetstvennosti.webp'),('ohrana-pri-otklyuchenii-elektrichestva-interneta-skud','stati-avariynyy-rezhim.webp'),('zashchita-ohrannoy-signalizacii-ot-glusheniya','stati-antiglushenie.webp'),('kak-umenshit-lozhnye-trevogi','stati-lozhnye-trevogi.webp'),('nuzhna-li-trevozhnaya-knopka-esli-est-kamery','stati-trevozhnaya-knopka.webp'),('kak-bystro-dolzhna-priehat-gbr','stati-vremya-pribytiya-gbr.webp'),('usilenie-ohrany-nochyu-vyhodnye-prazdniki','stati-usilenie-ohrany.webp'),('ohrana-obekta-vo-vremya-remonta-pereezda','stati-ohrana-remont-pereezd.webp'),('kak-zashchitit-dachu-zimoy','stati-dacha-zimoy.webp'),('kak-usilit-ohranu-sklada-v-pikovyy-sezon','stati-pik-skladskih-otgruzok.webp'),('chop-choo-vnevedomstvennaya-ohrana-raznica','stati-choo-vnevedomstvennaya.webp')]
          import shutil
          for slug,img in pairs:
              shutil.copy2(Path('stati')/(slug+'.html'), Path('restore-25/stati')/(slug+'.html'))
              shutil.copy2(Path('images')/img, Path('restore-25/images')/img)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ohrana-tech-restore-25-articles
          path: restore-25
          retention-days: 30

      - name: Commit normalization and remove one-time workflow
        run: |
          rm .github/workflows/restore-new25-articles.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stati assets/js/stati.js .github/workflows/restore-new25-articles.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Articles: restore and normalize new 25 article set'
            git push
          fi