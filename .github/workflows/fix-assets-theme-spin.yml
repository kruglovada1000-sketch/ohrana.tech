name: Fix assets theme spin

on:
  push:
    paths:
      - ".github/workflows/fix-assets-theme-spin.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make yin-yang smoothly rotatable in assets templates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/css/site-shell.css')
          s = p.read_text(encoding='utf-8')
          marker = 'assets-theme-yinyang-spin-v2'
          block = '''\n\n/* assets-theme-yinyang-spin-v2 */\n#themeToggle .theme-yinyang{\n  display:inline-flex!important;\n  align-items:center!important;\n  justify-content:center!important;\n  width:27px!important;\n  height:27px!important;\n  line-height:1!important;\n  transform-origin:50% 50%!important;\n  -webkit-transform-origin:50% 50%!important;\n  transform:translateY(-1px) rotate(0deg)!important;\n  -webkit-transform:translateY(-1px) rotate(0deg)!important;\n  transition:transform .72s cubic-bezier(.22,.61,.36,1)!important;\n  -webkit-transition:-webkit-transform .72s cubic-bezier(.22,.61,.36,1)!important;\n  will-change:transform;\n  backface-visibility:hidden;\n  -webkit-backface-visibility:hidden;\n}\n#themeToggle[aria-pressed="true"] .theme-yinyang{\n  transform:translateY(-1px) rotate(180deg)!important;\n  -webkit-transform:translateY(-1px) rotate(180deg)!important;\n}\n@media(max-width:420px){\n  #themeToggle .theme-yinyang{width:26px!important;height:26px!important}\n}\n@media(prefers-reduced-motion:reduce){\n  #themeToggle .theme-yinyang{\n    transition:transform .72s cubic-bezier(.22,.61,.36,1)!important;\n    -webkit-transition:-webkit-transform .72s cubic-bezier(.22,.61,.36,1)!important;\n  }\n}\n'''
          if marker not in s:
              p.write_text(s + block, encoding='utf-8')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-assets-theme-spin.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site-shell.css .github/workflows/fix-assets-theme-spin.yml
          git commit -m "UI: smooth theme spin in Articles and Regions"
          git push
