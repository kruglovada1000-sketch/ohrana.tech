name: One-time finish pricing carousel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finish-pricing-carousel-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finish pricing carousel
        run: |
          python scripts/finish-pricing-carousel-once.py
          python scripts/build_site.py
      - name: Validate and commit
        run: |
          grep -F 'Пост физической охраны усиленный' ceny/index.html
          grep -F 'от 230 000 ₽/месяц' ceny/index.html
          grep -F 'Охрана с оружием' ceny/index.html
          grep -F 'от 450 000 ₽/месяц' ceny/index.html
          grep -F '1 смена — 12 часов' ceny/index.html
          test "$(grep -o 'data-carousel-item' ceny/index.html | wc -l | tr -d ' ')" = "14"
          grep -F 'pricing-seamless-paired-carousel-v1' assets/css/pricing.css
          grep -F "speed=42" assets/js/site.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-src/pricing.json scripts/build_site.py site-src/assets/site.js site-src/assets/pricing.css assets/js/site.js assets/css/pricing.css ceny/index.html
          git commit -m 'Build seven-tariff seamless paired pricing carousel'
          git push origin HEAD:main
