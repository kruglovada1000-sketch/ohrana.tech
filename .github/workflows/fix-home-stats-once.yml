name: Fix homepage aligned stats once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-home-stats-once.yml'

permissions:
  contents: write

jobs:
  fix-home-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Fix homepage statistics
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          fixes=[
              ('<b class="num" data-count="20">20</b><span>лет опыта в охране</span>', '<b class="num" data-count="18">18</b><span>лет опыта в охране</span>'),
              ('<b class="num" data-count="8000" data-suffix="+">8 000+</b><span>охраняемых объектов</span>', '<b class="num" data-count="5000" data-suffix="+">5 000+</b><span>охраняемых объектов</span>'),
              ('<b class="num-static">10–15</b><span>минут — прибытие ГБР</span>', '<b class="num-static">5–10</b><span>минут — прибытие ГБР</span>'),
              ('ГБР на маршруте · 10–15 мин', 'ГБР на маршруте · 5–10 мин'),
          ]
          changed=0
          for old,new in fixes:
              n=text.count(old)
              if n:
                  text=text.replace(old,new)
                  changed+=n
          if changed:
              p.write_text(text,encoding='utf-8')
          print('REPLACEMENTS=',changed)
          PY
      - name: Commit homepage fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Align homepage statistics with ruscor24"
          git push
