name: Apply dragons visual to physical security page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dragons-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch source
        run: python scripts/patch_dragons_section01.py

      - name: Rebuild
        run: |
          python scripts/build_site.py
          python scripts/normalize_generated_links.py
          python scripts/normalize_jsonld_entities.py
          python scripts/normalize_counter_values.py
          python scripts/normalize_sitemap.py

      - name: Validate
        run: |
          git diff --check
          test -f images/dragons.png
          grep -q 'class="guard-visual"' fizicheskaya-ohrana/index.html
          grep -q '/images/dragons.png' fizicheskaya-ohrana/index.html
          grep -q 'guard-dragons-real-v3' css/fizicheskaya-ohrana.css
          grep -q 'height:auto' css/fizicheskaya-ohrana.css
          grep -q 'clip-path:polygon' css/fizicheskaya-ohrana.css

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site-src/pages/fizicheskaya-ohrana.source.html fizicheskaya-ohrana/index.html css/fizicheskaya-ohrana.css
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'feat: place full dragons image beside section 01 [skip ci]'
          git push origin HEAD:main
