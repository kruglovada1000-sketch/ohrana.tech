name: Apply dragons visual to physical security page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dragons-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch source
        run: python scripts/patch_dragons_section01.py

      - name: Rebuild
        run: |
          python scripts/build_site.py
          python scripts/normalize_generated_links.py
          python scripts/normalize_jsonld_entities.py
          python scripts/normalize_counter_values.py
          python scripts/normalize_sitemap.py

      - name: Build full deploy CSS in Assets
        run: |
          python - <<'PY'
          from pathlib import Path

          base_path = Path('css/fizicheskaya-ohrana-base.css')
          overlay_path = Path('css/fizicheskaya-ohrana.css')
          out_path = Path('assets/css/fizicheskaya-ohrana.css')

          base = base_path.read_text(encoding='utf-8').rstrip()
          overlay = overlay_path.read_text(encoding='utf-8')
          lines = overlay.splitlines()
          if lines and lines[0].lstrip().startswith('@import '):
              lines = lines[1:]
          overlay = '\n'.join(lines).lstrip().rstrip()

          out_path.write_text(base + '\n\n' + overlay + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          git diff --check
          test -f images/dragons.png
          grep -q 'class="guard-visual"' site-src/pages/fizicheskaya-ohrana.source.html
          grep -q '/images/dragons.png' site-src/pages/fizicheskaya-ohrana.source.html
          grep -q 'guard-dragons-real-v3' site-src/pages/fizicheskaya-ohrana.source.html
          grep -q 'width:min(100%,380px)' site-src/pages/fizicheskaya-ohrana.source.html
          grep -q 'dragons-section-01-right-v7' assets/css/fizicheskaya-ohrana.css
          test "$(wc -c < assets/css/fizicheskaya-ohrana.css)" -gt 25000

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site-src/pages/fizicheskaya-ohrana.source.html fizicheskaya-ohrana/index.html css/fizicheskaya-ohrana.css assets/css/fizicheskaya-ohrana.css
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'fix: build full physical security CSS asset [skip ci]'
          git push origin HEAD:main
