name: Apply dragons visual to physical security page

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dragons-main.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch source
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('site-src/pages/fizicheskaya-ohrana.source.html')
          text=path.read_text(encoding='utf-8')
          marker='/* guard-dragons-visual-v2 */'
          if marker not in text:
              anchor='.flip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;position:relative}'
              if anchor not in text: raise SystemExit('CSS anchor not found')
              css='''/* guard-dragons-visual-v2 */
.guard-intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,440px);gap:54px;align-items:center;position:relative;z-index:1;margin-bottom:48px}
.guard-intro .sec-head{max-width:760px;margin-bottom:0}
.guard-visual{margin:0;min-width:0;display:flex;align-items:center;justify-content:center;position:relative}
.guard-visual::before{content:"";position:absolute;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(232,200,122,.08),transparent 68%);filter:blur(12px);pointer-events:none}
.guard-visual img{position:relative;z-index:1;display:block;width:100%;max-width:440px;height:auto;max-height:420px;object-fit:contain;border:1px solid rgba(232,200,122,.58);border-radius:22px;padding:4px;background:rgba(7,9,13,.32);filter:drop-shadow(0 20px 34px rgba(0,0,0,.42))}
@media(max-width:960px){.guard-intro{grid-template-columns:1fr;gap:28px}.guard-intro .sec-head{max-width:820px}.guard-visual{width:min(100%,620px);margin:0 auto}.guard-visual img{max-width:560px;max-height:none}}
@media(max-width:640px){.guard-intro{gap:20px;margin-bottom:34px}.guard-visual{width:100%}.guard-visual img{max-width:100%;border-radius:18px;padding:3px}}
'''
              text=text.replace(anchor,css+anchor,1)
          if 'class="guard-visual"' not in text:
              old='''      <div class="sec-head" data-reveal>
        <span class="sec-num">01</span>
        <span class="eyebrow">Совет от практиков</span>
        <h2>Как выбрать ЧОО и <em>не ошибиться</em></h2>
        <p>Цены на охрану различаются в разы, а защищать приходится реальные деньги, товар и людей. Шесть пунктов, которые нужно проверить до подписания договора — любой компании, не только нам. Наведите курсор или коснитесь карточки, чтобы увидеть, как обстоит дело у нас.</p>
      </div>

      <div class="flip-grid" data-reveal>'''
              new='''      <div class="guard-intro">
        <div class="sec-head" data-reveal>
          <span class="sec-num">01</span>
          <span class="eyebrow">Совет от практиков</span>
          <h2>Как выбрать ЧОО и <em>не ошибиться</em></h2>
          <p>Цены на охрану различаются в разы, а защищать приходится реальные деньги, товар и людей. Шесть пунктов, которые нужно проверить до подписания договора — любой компании, не только нам. Наведите курсор или коснитесь карточки, чтобы увидеть, как обстоит дело у нас.</p>
        </div>
        <figure class="guard-visual" data-reveal>
          <img src="/images/dragons.png" alt="Физическая охрана ЧОО «Рускорпорация»" loading="lazy" decoding="async">
        </figure>
      </div>

      <div class="flip-grid" data-reveal>'''
              if old not in text: raise SystemExit('section 01 anchor not found')
              text=text.replace(old,new,1)
          path.write_text(text.rstrip()+'\n',encoding='utf-8')
          PY

      - name: Rebuild
        run: |
          python scripts/build_site.py
          python scripts/build_object_pages.py
          python scripts/normalize_generated_links.py
          python scripts/normalize_jsonld_entities.py
          python scripts/normalize_counter_values.py
          python scripts/normalize_sitemap.py

      - name: Validate
        run: |
          git diff --check
          test -f images/dragons.png
          grep -q '/images/dragons.png' fizicheskaya-ohrana/index.html
          grep -q 'guard-dragons-visual-v2' assets/css/fizicheskaya-ohrana.css
          grep -q 'border-radius:22px' assets/css/fizicheskaya-ohrana.css

      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- site-src/pages/fizicheskaya-ohrana.source.html fizicheskaya-ohrana/index.html assets/css/fizicheskaya-ohrana.css
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'feat: add dragons visual to physical security section 01 [skip ci]'
          git push origin HEAD:main
