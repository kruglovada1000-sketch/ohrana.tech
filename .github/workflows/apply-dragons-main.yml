name: Build physical security CSS asset

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-dragons-main.yml'
      - 'css/fizicheskaya-ohrana.css'
      - 'css/fizicheskaya-ohrana-base.css'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build full deploy CSS in Assets
        run: |
          python - <<'PY'
          from pathlib import Path

          base_path = Path('css/fizicheskaya-ohrana-base.css')
          overlay_path = Path('css/fizicheskaya-ohrana.css')
          out_path = Path('assets/css/fizicheskaya-ohrana.css')

          base = base_path.read_text(encoding='utf-8').rstrip()
          overlay = overlay_path.read_text(encoding='utf-8')
          lines = overlay.splitlines()
          if lines and lines[0].lstrip().startswith('@import '):
              lines = lines[1:]
          overlay = '\n'.join(lines).lstrip().rstrip()

          out_path.write_text(base + '\n\n' + overlay + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          git diff --check
          test -f images/dragons.png
          grep -q 'dragons-section-01-right-v8' assets/css/fizicheskaya-ohrana.css
          grep -q 'height:calc(var(--dragon-size) - 2px)' assets/css/fizicheskaya-ohrana.css
          grep -q "url('/images/dragons.png') center/cover no-repeat" assets/css/fizicheskaya-ohrana.css
          test "$(wc -c < assets/css/fizicheskaya-ohrana.css)" -gt 25000

      - name: Commit asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/css/fizicheskaya-ohrana.css
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'fix: rebuild full physical security CSS asset [skip ci]'
          git push origin HEAD:main
