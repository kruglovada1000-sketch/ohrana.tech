name: One-time audit findings repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-audit-findings-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audit repairs
        run: python scripts/fix-audit-findings-once.py
      - name: Validate and commit
        run: |
          git diff --check
          python scripts/validate_shared_shell.py
          grep -F 'themePlacementMq' assets/js/site.js
          grep -F 'audit-readability-v1' assets/css/site-shell.css
          grep -F 'homepage-theme-yinyang-js-v3' index.html
          grep -F 'home-light-fix.css?v=20260921-4' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/css/home-light-fix.css assets/css/site-shell.css assets/js/site.js site-src/assets/site-shell.css site-src/assets/site.js
          git commit -m 'Fix audit findings across responsive theme and light mode'
          git push origin HEAD:main
