name: One-time physical person pricing number alignment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-physical-person-pricing-number-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align pricing section number
        run: python scripts/fix-physical-person-pricing-number-once.py
      - name: Validate and commit
        run: |
          grep -F 'pricing-section-number-align-v1' assets/css/ohrana-fizicheskih-lic.css
          grep -F 'pricing-section-number-align-v1' site-src/pages/ohrana-fizicheskih-lic.source.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/css/ohrana-fizicheskih-lic.css site-src/pages/ohrana-fizicheskih-lic.source.html
          git commit -m 'Align personal protection pricing section number'
          git push origin HEAD:main
