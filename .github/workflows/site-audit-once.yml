name: One-time full site audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-audit-once.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/site-audit-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/site-audit-http.log
          exit 1
      - name: Audit all sitemap pages in dark and light themes
        run: node scripts/site-audit-once.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit/
          retention-days: 3
