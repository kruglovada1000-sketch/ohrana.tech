name: Patch dragons styles in assets CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-assets-dragons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/css/fizicheskaya-ohrana.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* dragons-section-01-assets-v1 */'
          if marker not in text:
              css = r'''

/* dragons-section-01-assets-v1 */
#guard>.wrap{position:relative}
#guard .sec-head{
  max-width:720px;
  min-height:350px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding-right:12px;
}
#guard>.wrap::after{
  content:"";
  position:absolute;
  top:48px;
  right:28px;
  width:min(30vw,370px);
  aspect-ratio:1/1;
  background:url('/images/dragons.png') center/contain no-repeat;
  border:1px solid rgba(232,200,122,.9);
  box-shadow:inset 0 0 0 1px rgba(245,227,179,.10);
  clip-path:polygon(14px 0,calc(100% - 14px) 0,100% 14px,100% calc(100% - 14px),calc(100% - 14px) 100%,14px 100%,0 calc(100% - 14px),0 14px);
  pointer-events:none;
  z-index:1;
  filter:drop-shadow(0 18px 34px rgba(0,0,0,.35));
}
#guard .sec-head,#guard .flip-grid,#guard .highlight-box{position:relative;z-index:2}
@media(max-width:1100px){
  #guard .sec-head{max-width:650px;min-height:320px}
  #guard>.wrap::after{width:min(29vw,335px);right:22px;top:54px}
}
@media(max-width:960px){
  #guard .sec-head{max-width:100%;min-height:0;display:block;padding-right:0;margin-bottom:28px}
  #guard>.wrap{padding-bottom:380px}
  #guard>.wrap::after{
    top:auto;
    bottom:28px;
    left:50%;
    right:auto;
    width:min(78vw,340px);
    transform:translateX(-50%);
  }
}
@media(max-width:640px){
  #guard>.wrap{padding-bottom:345px}
  #guard>.wrap::after{width:min(82vw,310px);bottom:22px}
}
'''
              path.write_text(text.rstrip() + css + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'dragons-section-01-assets-v1' assets/css/fizicheskaya-ohrana.css
          grep -q "url('/images/dragons.png')" assets/css/fizicheskaya-ohrana.css
          test -f images/dragons.png
          git diff --check

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/css/fizicheskaya-ohrana.css
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'style: add compact dragons visual to assets css [skip ci]'
          git push origin HEAD:main
