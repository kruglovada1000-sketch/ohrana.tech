name: Patch dragons styles in assets CSS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-assets-dragons.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch CSS
        env:
          DRAGONS_CSS_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path('assets/css/fizicheskaya-ohrana.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* dragons-section-01-assets-v1 */'
          if marker not in text:
              css = base64.b64decode(os.environ['DRAGONS_CSS_B64']).decode('utf-8')
              path.write_text(text.rstrip() + '\n' + css + '\n', encoding='utf-8')
          PY

      - name: Validate
        run: |
          grep -q 'dragons-section-01-assets-v1' assets/css/fizicheskaya-ohrana.css
          grep -q "url('/images/dragons.png')" assets/css/fizicheskaya-ohrana.css
          test -f images/dragons.png
          git diff --check

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/css/fizicheskaya-ohrana.css
          if git diff --cached --quiet; then echo 'Already current'; exit 0; fi
          git commit -m 'style: add compact dragons visual to assets css [skip ci]'
          git push origin HEAD:main
