name: Site hotfix 2026-09-30

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/site-hotfix-20260930.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply urgent commercial and SEO corrections
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          changed = set()

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write_if_changed(path, before, after):
              if after != before:
                  Path(path).write_text(after, encoding='utf-8')
                  changed.add(path)

          # 1) Correct company terminology and GБР response time on key commercial pages.
          gbr_pages = [
              'index.html',
              'fizicheskaya-ohrana/index.html',
              'ohrana-pult/index.html',
              'ohrana-meropriyatiy/index.html',
              'ohrana-meropriyatiy-v-moskve/index.html',
          ]
          for path in gbr_pages:
              s = read(path)
              out = s.replace('5–10', '10–15').replace('5-10', '10-15')
              write_if_changed(path, s, out)

          # Main page: official term is ЧОО, and event security is billed hourly.
          path = 'index.html'
          s = read(path)
          out = s
          out = out.replace('Лицензированное частное охранное предприятие', 'Лицензированная частная охранная организация')
          out = out.replace('лицензированное частное охранное предприятие', 'лицензированная частная охранная организация')
          out = out.replace("['Охрана мероприятий','35 000 ₽','event','/ohrana-meropriyatiy/']", "['Охрана мероприятий','4 000 ₽/час','event','/ohrana-meropriyatiy/']")
          write_if_changed(path, s, out)

          # Event-security landing: one clear base rate everywhere — 4,000 RUB/hour per guard.
          path = 'ohrana-meropriyatiy/index.html'
          s = read(path)
          out = s
          out = out.replace('копию лицензии ЧОП', 'копию лицензии ЧОО')
          for old in ('8000', '14000', '25000'):
              out = out.replace(f'"minPrice":"{old}","priceCurrency":"RUB","unitText":"смена 4 часа"', '"minPrice":"4000","priceCurrency":"RUB","unitText":"час за 1 охранника"')
          for old in ('8 000', '14 000', '25 000'):
              out = out.replace(f'от {old} ₽/смена', 'от 4 000 ₽/час')
              out = out.replace(f'от {old} ₽<span> / смена (4 ч)</span>', 'от 4 000 ₽<span> / час за 1 охранника</span>')
          out = out.replace('Тарифы от 8 000 ₽ за смену (4 часа), минимальный заказ — 4 часа.', 'Стоимость от 4 000 ₽ в час за 1 охранника, минимальный заказ — 4 часа.')
          write_if_changed(path, s, out)

          # Event calculator: same hourly base rate for all current selector variants.
          path = 'js/ohrana-meropriyatiy.js'
          s = read(path)
          out = re.sub(r'var rates=\{standard:\d+,premium:\d+,vip:\d+\};', 'var rates={standard:4000,premium:4000,vip:4000};', s)
          write_if_changed(path, s, out)

          # Physical-security page: remove the old per-event price and correct GБР wording.
          path = 'fizicheskaya-ohrana/index.html'
          s = read(path)
          out = s
          out = out.replace('"minPrice":"35000","priceCurrency":"RUB","unitText":"событие"', '"minPrice":"4000","priceCurrency":"RUB","unitText":"час за 1 охранника"')
          out = out.replace('<div class="price-item"><span>Охрана мероприятия (до 100 человек)</span><b>от 35 000 ₽ /событие</b></div>', '<div class="price-item"><span>Охрана мероприятия</span><b>от 4 000 ₽ /час за 1 охранника</b></div>')
          write_if_changed(path, s, out)

          # Moscow event landing: hourly rate and correct official terminology.
          path = 'ohrana-meropriyatiy-v-moskve/index.html'
          s = read(path)
          out = s
          out = out.replace('"lowPrice":"25000"', '"lowPrice":"4000"')
          out = out.replace('от 25 000 ₽ / событие', 'от 4 000 ₽ / час за 1 охранника')
          out = out.replace('от 35 000 ₽ / событие', 'от 4 000 ₽ / час за 1 охранника')
          out = out.replace('при инциденте отвечает ЧОП', 'при инциденте отвечает ЧОО')
          write_if_changed(path, s, out)

          # Prices catalog: ЧОО terminology + event rate in visible copy and structured data.
          path = 'ceny/index.html'
          s = read(path)
          out = s.replace('Цены на услуги ЧОП', 'Цены на услуги ЧОО')
          for old in ('8000', '14000', '25000'):
              out = out.replace(f'"minPrice":"{old}","priceCurrency":"RUB","unitText":"4 часа"', '"minPrice":"4000","priceCurrency":"RUB","unitText":"час за 1 охранника"')
          out = out.replace('от 8 000 ₽/4 часа', 'от 4 000 ₽/час за 1 охранника')
          write_if_changed(path, s, out)

          # Yandex services feed must match the site price.
          path = 'yandex-services.yml'
          s = read(path)
          out = s
          out = re.sub(r'<yml_catalog date="[^"]+">', '<yml_catalog date="2026-09-30 12:00">', out, count=1)
          out = out.replace('<price from="true">25000</price>\n        <currencyId>RUR</currencyId>\n        <categoryId>27</categoryId>\n        <set-ids>event-security</set-ids>', '<price from="true">4000</price>\n        <currencyId>RUR</currencyId>\n        <categoryId>27</categoryId>\n        <set-ids>event-security</set-ids>')
          out = out.replace('<sales_notes>Цена от 25 000 ₽ за мероприятие</sales_notes>', '<sales_notes>Цена от 4 000 ₽ в час за 1 охранника</sales_notes>')
          write_if_changed(path, s, out)

          # Refresh sitemap lastmod for edited indexable pages.
          sitemap = Path('sitemap.xml')
          if sitemap.exists():
              s = sitemap.read_text(encoding='utf-8')
              out = s
              urls = [
                  'https://ohrana.tech/',
                  'https://ohrana.tech/fizicheskaya-ohrana/',
                  'https://ohrana.tech/ohrana-pult/',
                  'https://ohrana.tech/ohrana-meropriyatiy/',
                  'https://ohrana.tech/ohrana-meropriyatiy-v-moskve/',
                  'https://ohrana.tech/ceny/',
              ]
              for url in urls:
                  pat = re.compile(r'(<url><loc>'+re.escape(url)+r'</loc><lastmod>)([^<]+)(</lastmod></url>)')
                  out = pat.sub(r'\g<1>2026-09-30\g<3>', out)
              write_if_changed('sitemap.xml', s, out)

          # Verification: key pages must not advertise the obsolete GБР timing.
          for path in gbr_pages:
              t = read(path)
              if '5–10' in t or '5-10' in t:
                  raise SystemExit(f'Obsolete GБР timing remains in {path}')

          event = read('ohrana-meropriyatiy/index.html')
          if 'от 4 000 ₽/час' not in event:
              raise SystemExit('Event page did not receive 4,000 RUB/hour rate')
          js = read('js/ohrana-meropriyatiy.js')
          if 'var rates={standard:4000,premium:4000,vip:4000};' not in js:
              raise SystemExit('Event calculator rate was not updated')
          feed = read('yandex-services.yml')
          if '<set-ids>event-security</set-ids>' not in feed or 'Цена от 4 000 ₽ в час за 1 охранника' not in feed:
              raise SystemExit('Yandex event offer was not updated')

          print('CHANGED_FILES:')
          for p in sorted(changed):
              print(' -', p)
          PY

      - name: Commit hotfix and remove one-off workflow
        shell: bash
        run: |
          rm -f .github/workflows/site-hotfix-20260930.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Hotfix: event rate, GБР timing and commercial SEO consistency"
          git push
