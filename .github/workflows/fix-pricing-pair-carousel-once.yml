name: One-time exact two-card pricing carousel fix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-pricing-pair-carousel-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact two-card carousel fix
        run: |
          python scripts/fix-pricing-pair-carousel-once.py
          python scripts/build_site.py
          python - <<'PY'
          from pathlib import Path
          for name in ('site-src/assets/pricing.css','assets/css/pricing.css'):
              p=Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n', encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          test "$(grep -o 'data-carousel-pair' ceny/index.html | wc -l | tr -d ' ')" = "7"
          test "$(grep -o 'class=\"tariff-card tariff-image-card\"' ceny/index.html | wc -l | tr -d ' ')" = "7"
          grep -F 'pricing-pair-carousel-v3-exact-two' assets/css/pricing.css
          grep -F "track.style.transform='translate3d('+(-active*100)+'%,0,0)'" assets/js/site.js
          grep -F '/assets/css/pricing.css?v=20260921-pairs3' ceny/index.html
          grep -F '/assets/js/site.js?v=20260921-pairs3' ceny/index.html
          ! grep -F 'speed=42' assets/js/site.js
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-src/assets/site.js site-src/assets/pricing.css scripts/build_site.py assets/js/site.js assets/css/pricing.css ceny/index.html
          git commit -m 'Fix pricing carousel to one description-image pair per slide'
          git push origin HEAD:main
