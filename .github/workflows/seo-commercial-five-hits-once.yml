name: SEO commercial five hits once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo-commercial-five-hits-once.yml'

permissions:
  contents: write

jobs:
  improve-commercial-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply five commercial SEO improvements
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 match for {label}, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              print(f'OK {path}: {label}')

          # 1/5 — warehouses: commercial intent + one-day launch
          f='ohrana-skladov/index.html'
          replace_once(f,
            '<title>Охрана складов в Москве — ЧОО Рускорпорация | Физическая и пультовая охрана складов</title>',
            '<title>Охрана складов и логистических комплексов в Москве и МО | ЧОО «Рускорпорация»</title>',
            'warehouse title')
          replace_once(f,
            '<meta name="description" content="Профессиональная охрана складов и логистических центров в Москве и МО. Контроль доступа, патрулирование, видеонаблюдение, охрана периметра. Лицензия Росгвардии. Заявка онлайн.">',
            '<meta name="description" content="Физическая охрана складов и логистических комплексов в Москве и МО. КПП, досмотр транспорта, пропускной режим, обход территории. Стандартный пост охраны — за 1 день. ЧОО «Рускорпорация».">',
            'warehouse description')
          replace_once(f,
            '<h1 data-reveal>Охрана <em>складов</em> в Москве</h1>',
            '<h1 data-reveal>Охрана <em>складов и логистических комплексов</em> в Москве и МО</h1>',
            'warehouse h1')
          replace_once(f,
            '<p class="lead" data-reveal>Профессиональная охрана складов, логистических центров и хранилищ. Контроль доступа, патрулирование, видеонаблюдение, охрана периметра. Лицензия Росгвардии, материальная ответственность по договору.</p>',
            '<p class="lead" data-reveal><strong>Выставим стандартный пост охраны за 1 день.</strong> КПП, контроль въезда и выезда транспорта, пропускной режим, обход территории и видеонаблюдение. Лицензия Росгвардии, материальная ответственность по договору.</p>',
            'warehouse lead')
          replace_once(f, 'Вывод за 1–3 дня', 'Пост охраны за 1 день', 'warehouse speed')
          replace_once(f, 'От заявки до выхода охраны на объект — в среднем 1–3 дня', 'Стандартный пост охраны можем выставить за 1 день', 'warehouse process')

          # 2/5 — enterprises / factories / production
          f='ohrana-predpriyatij/index.html'
          replace_once(f,
            '<title>Охрана предприятий в Москве | ЧОО «Рускорпорация»</title>',
            '<title>Охрана предприятий, производств и заводов в Москве и МО | ЧОО «Рускорпорация»</title>',
            'enterprise title')
          replace_once(f,
            '<meta name="description" content="Профессиональная охрана предприятий в Москве и регионах. Комплексная безопасность бизнеса: посты, патрули, ГБР, видеонаблюдение. Лицензия, страхование. Расчёт за 15 минут.">',
            '<meta name="description" content="Физическая охрана предприятий, производств и заводов в Москве и МО. КПП, посты, пропускной режим, патрулирование, ГБР и видеонаблюдение. Стандартный пост — от 24 часов.">',
            'enterprise description')
          replace_once(f,
            '<h1 data-reveal>Охрана <em>предприятий</em> в Москве</h1>',
            '<h1 data-reveal>Охрана <em>предприятий и производств</em> в Москве и МО</h1>',
            'enterprise h1')
          replace_once(f,
            '<p class="lead" data-reveal>Комплексная безопасность вашего бизнеса: посты охраны, мобильные патрули, видеонаблюдение и группы быстрого реагирования. Защита от краж, вандализма и промышленного шпионажа. Лицензия Росгвардии, полная материальная ответственность.</p>',
            '<p class="lead" data-reveal>Физическая охрана предприятий, производств и заводов: КПП, пропускной режим, контроль транспорта, мобильные патрули, видеонаблюдение и ГБР. Для стандартного объекта пост можем выставить <strong>от 24 часов</strong>. Лицензия Росгвардии, материальная ответственность по договору.</p>',
            'enterprise lead')
          replace_once(f, 'Индивидуальный план</li>', 'Пост от 24 часов</li>', 'enterprise speed')

          # 3/5 — construction sites
          f='ohrana-stroitelnyh-obektov/index.html'
          replace_once(f,
            '<title>Охрана строительных площадок в Москве — ЧОО Рускорпорация | Охрана строек</title>',
            '<title>Охрана стройплощадок и строительных объектов в Москве и МО | ЧОО «Рускорпорация»</title>',
            'construction title')
          replace_once(f,
            '<meta name="description" content="Профессиональная охрана строительных площадок в Москве и МО. Охрана техники, материалов и оборудования. Патрулирование, контроль вывоза, видеонаблюдение. Лицензия Росгвардии. Заявка онлайн.">',
            '<meta name="description" content="Охрана стройплощадок и строительных объектов в Москве и МО. Пост на КПП, контроль вывоза материалов, техники и транспорта, обход периметра. Стандартный пост — за 1 день.">',
            'construction description')
          replace_once(f,
            '<h1 data-reveal>Охрана <em>строительных площадок</em> в Москве</h1>',
            '<h1 data-reveal>Охрана <em>стройплощадок и строительных объектов</em> в Москве и МО</h1>',
            'construction h1')
          replace_once(f,
            '<p class="lead" data-reveal>Профессиональная <strong>охрана стройплощадок</strong>, техники и материалов. Патрулирование, контроль вывоза, видеонаблюдение, охрана периметра. Лицензия Росгвардии, материальная ответственность по договору.</p>',
            '<p class="lead" data-reveal><strong>Пост охраны на стройплощадку — за 1 день.</strong> Контроль КПП, въезда и вывоза материалов, охрана техники, обход периметра и видеонаблюдение. Лицензия Росгвардии, материальная ответственность по договору.</p>',
            'construction lead')
          replace_once(f, 'Вывод за 1–3 дня', 'Пост охраны за 1 день', 'construction speed')

          # 4/5 — physical security: prioritize commercial objects, demote cargo escort
          f='fizicheskaya-ohrana/index.html'
          replace_once(f,
            '<meta name="description" content="Профессиональная физическая охрана объектов в Москве и регионах. Постовая, мобильная, личная охрана. Лицензия Росгвардии, ГБР, страхование ответственности до 50 млн ₽. Расчёт за 15 минут.">',
            '<meta name="description" content="Физическая охрана объектов в Москве и МО: склады, предприятия, стройплощадки, офисы и ЖК. Посты, КПП, патрулирование, ГБР. Стандартный пост — от 24 часов. ЧОО «Рускорпорация».">',
            'physical description')
          replace_once(f,
            '<p class="lead" data-reveal>Профессиональная защита вашего бизнеса, имущества и людей. Постовая, мобильная и личная охрана с 2008 года. Лицензия Росгвардии, собственная ГБР, страхование ответственности до 50 млн ₽.</p>',
            '<p class="lead" data-reveal>Физическая охрана складов, предприятий, стройплощадок, офисов и жилых комплексов. Посты, КПП, патрулирование и ГБР. Для стандартного объекта пост можем выставить <strong>от 24 часов</strong>. Лицензия Росгвардии, материальная ответственность по договору.</p>',
            'physical lead')
          replace_once(f, 'Бесплатный аудит</li>', 'Пост от 24 часов</li>', 'physical speed')
          replace_once(f, '<h4>Сопровождение грузов</h4>', '<h4>Охрана складов и предприятий</h4>', 'physical commercial card title')
          replace_once(f,
            '<p>Инкассация, перевозка дорогостоящих товаров, ювелирных изделий, документов. <span class="accent">Полная сохранность.</span></p>',
            '<p>КПП, пропускной режим, досмотр транспорта и обход территории. <span class="accent">Для складов, производств и логистических комплексов.</span> <a href="/ohrana-skladov/">Склады</a> · <a href="/ohrana-predpriyatij/">Предприятия</a>.</p>',
            'physical commercial card text')
          p=Path(f)
          t=p.read_text(encoding='utf-8')
          t=t.replace('Лицензированное ЧОП —', 'Лицензированное ЧОО —')
          t=t.replace('ООО ЧОП «Рускорпорация»', 'ООО ЧОО «Рускорпорация»')
          t=t.replace('ООО ЧОП «Рускорпорация охрана и консалтинг»', 'ООО ЧОО «Рускорпорация охрана и консалтинг»')
          p.write_text(t,encoding='utf-8')

          # 5/5 — homepage: convert general interest into an urgent commercial route
          f='index.html'
          replace_once(f,
            '<meta name="description" content="Лицензированное ЧОО в Москве и МО. Физическая и пультовая охрана от 5 000 ₽/мес. ГБР за 10-15 минут. Договор с материальной ответственностью. Выезд специалиста бесплатно. ☎ +7 (925) 047-42-25">',
            '<meta name="description" content="Физическая охрана объектов в Москве и МО: склады, предприятия, стройплощадки, офисы и ЖК. Стандартный пост охраны — за 1 день. Договор с материальной ответственностью. ☎ +7 (925) 047-42-25">',
            'home description')
          replace_once(f,
            '<p class="lead">Лицензированная частная охранная организация. Физическая и пультовая охрана по договору с материальной ответственностью. <b>Группа быстрого реагирования — за 10–15 минут.</b></p>',
            '<p class="lead">Лицензированная частная охранная организация. Физическая охрана складов, предприятий, строек, офисов и ЖК. <b>Стандартный пост охраны — за 1 день.</b> Договор с материальной ответственностью, ГБР — 10–15 минут.</p>',
            'home hero lead')
          replace_once(f,
            '<p>От заявки до полностью работающей охраны — несколько дней, всё берём на себя.</p>',
            '<p>Стандартный пост физической охраны можем выставить за 1 день. Сложные объекты запускаем после аудита и согласования схемы.</p>',
            'home process intro')
          replace_once(f,
            '<div class="step"><span class="sn">01</span><span class="st-time">1 день</span><b>Заявка и выезд</b><p>Специалист бесплатно приезжает на объект, оценивает риски и готовит расчёт.</p></div>',
            '<div class="step"><span class="sn">01</span><span class="st-time">сегодня</span><b>Заявка и задача</b><p>Уточняем объект, посты, график и обязанности. При необходимости оперативно выезжаем на объект.</p></div>',
            'home step 1')
          replace_once(f,
            '<div class="step"><span class="sn">02</span><span class="st-time">1–3 дня</span><b>Договор и запуск</b><p>Монтаж оборудования или выставление поста. Цена фиксируется в договоре.</p></div>',
            '<div class="step"><span class="sn">02</span><span class="st-time">до 24 ч</span><b>Договор и запуск</b><p>Согласовываем договор и выставляем стандартный пост. Цена и обязанности фиксируются в договоре.</p></div>',
            'home step 2')

          # Refresh sitemap lastmod for the five strengthened landing pages.
          sm=Path('sitemap.xml')
          if sm.exists():
              text=sm.read_text(encoding='utf-8')
              urls=[
                'https://ohrana.tech/',
                'https://ohrana.tech/ohrana-skladov/',
                'https://ohrana.tech/ohrana-predpriyatij/',
                'https://ohrana.tech/ohrana-stroitelnyh-obektov/',
                'https://ohrana.tech/fizicheskaya-ohrana/'
              ]
              for url in urls:
                  pat=re.compile(r'(<loc>'+re.escape(url)+r'</loc>\s*<lastmod>)([^<]+)(</lastmod>)')
                  text,n=pat.subn(r'\g<1>2026-10-01\g<3>',text)
                  print('SITEMAP',url,'updated' if n else 'entry/no-lastmod not changed')
              sm.write_text(text,encoding='utf-8')

          print('Five commercial SEO hits completed successfully.')
          PY

      - name: Validate changed HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=[
            'index.html',
            'ohrana-skladov/index.html',
            'ohrana-predpriyatij/index.html',
            'ohrana-stroitelnyh-obektov/index.html',
            'fizicheskaya-ohrana/index.html'
          ]
          for f in files:
              t=Path(f).read_text(encoding='utf-8')
              assert '<title>' in t and '</title>' in t, f
              assert '<h1' in t and '</h1>' in t, f
              assert '</html>' in t, f
              print('VALID',f,len(t))
          PY

      - name: Commit five SEO improvements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ohrana-skladov/index.html ohrana-predpriyatij/index.html ohrana-stroitelnyh-obektov/index.html fizicheskaya-ohrana/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "SEO: strengthen five commercial landing pages"
          git push
