name: Add services nav once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-uslugi-nav-once.yml'

permissions:
  contents: write

jobs:
  patch-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Add Services after Home without touching homepage
        shell: python
        run: |
          from pathlib import Path

          home = '<a href="/">Главная</a>'
          services = '<a href="/uslugi/">Услуги</a>'
          changed = []

          for path in Path('.').rglob('index.html'):
              if path == Path('index.html'):
                  continue
              if 'site-src' in path.parts or '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              if 'id="siteNav"' not in text or services in text or home not in text:
                  continue
              text = text.replace(home, home + '\n      ' + services, 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          partial = Path('site-src/partials/header.html')
          text = partial.read_text(encoding='utf-8')
          if services not in text:
              if home not in text:
                  raise SystemExit('Shared header marker not found')
              partial.write_text(text.replace(home, home + '\n      ' + services, 1), encoding='utf-8')
              changed.append(str(partial))

          print('Changed files:', len(changed))
          for item in changed:
              print(item)
          if len(changed) < 2:
              raise SystemExit('Expected shared navigation changes were not found')

      - name: Commit only navigation changes
        run: |
          rm -f .github/workflows/add-uslugi-nav-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Services tab after Home across internal pages [skip ci]"
          git push origin main
