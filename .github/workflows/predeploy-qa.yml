name: Predeploy QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/predeploy-qa.yml'

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild and verify services
        run: |
          python scripts/build_services_group_a.py
          python scripts/build_services_group_b.py
          python scripts/build_services_group_c.py
          python scripts/build_services_group_d.py
          python scripts/build_services_group_e.py
          git diff --exit-code -- uslugi sitemap.xml

      - name: Structural QA
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, sys
          root=Path('.')
          groups=[json.loads((root/f'site-src/services-group-{x}.json').read_text(encoding='utf-8')) for x in 'abcde']
          services=[s for g in groups for s in g['services']]
          urls=['/uslugi/']+[g['url'] for g in groups]+[s['url'] for s in services]
          errors=[]
          if len(services)!=45 or len(set(urls))!=51: errors.append(f'bad service counts: {len(services)} / {len(set(urls))}')
          sitemap=(root/'sitemap.xml').read_text(encoding='utf-8')
          for url in urls:
            p=root/url.strip('/')/'index.html'
            if not p.exists(): errors.append(f'missing {p}'); continue
            t=p.read_text(encoding='utf-8'); canonical='https://ohrana.tech'+url
            if canonical not in t: errors.append(f'canonical {url}')
            if canonical not in sitemap: errors.append(f'sitemap {url}')
            if '<h1' not in t: errors.append(f'h1 {url}')
            for ref in re.findall(r'(?:src|href)=["\'](/(?:images|css|js)/[^"\'#?]+)',t):
              if not (root/ref.lstrip('/')).exists(): errors.append(f'asset {url} -> {ref}')
          for s in services:
            t=(root/s['url'].strip('/')/'index.html').read_text(encoding='utf-8')
            if '"@type":"Service"' not in t and '"@type": "Service"' not in t: errors.append('schema '+s['url'])
            if 'https://formspree.io/f/mvkpbvnb' not in t: errors.append('form '+s['url'])
          home=(root/'index.html').read_text(encoding='utf-8')
          internal=(root/'dogovor/index.html').read_text(encoding='utf-8')
          if 'hd-main-site' not in home or 'https://ruscor24.ru/' not in home: errors.append('home-only button missing')
          if 'hd-main-site' in internal: errors.append('home-only button leaked internal')
          robots=(root/'robots.txt').read_text(encoding='utf-8')
          if 'User-agent: OAI-SearchBot' not in robots or 'Sitemap: https://ohrana.tech/sitemap.xml' not in robots: errors.append('robots AI/sitemap')
          print(f'Services: {len(services)}; service URLs: {len(set(urls))}')
          if errors:
            print('\n'.join('ERROR '+e for e in errors)); sys.exit(1)
          print('STRUCTURAL QA GREEN')
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/ohrana-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          exit 1

      - name: Browser QA
        run: node scripts/visual-smoke.mjs

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: predeploy-qa-${{ github.sha }}
          path: visual-qa/
          if-no-files-found: warn
          retention-days: 7
