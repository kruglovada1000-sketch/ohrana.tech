name: One-time restore manual paired pricing carousel

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-manual-paired-pricing-carousel-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore manual paired carousel
        run: |
          python scripts/restore-manual-paired-pricing-carousel-once.py
          python scripts/build_site.py
      - name: Validate and commit
        run: |
          test "$(grep -o 'data-carousel-pair' ceny/index.html | wc -l | tr -d ' ')" = "7"
          test "$(grep -o 'class=\"tariff-card tariff-image-card\"' ceny/index.html | wc -l | tr -d ' ')" = "7"
          grep -F 'pricing-manual-paired-carousel-v2' assets/css/pricing.css
          grep -F "pairs=Array.prototype.slice.call(carousel.querySelectorAll('[data-carousel-pair]'))" assets/js/site.js
          ! grep -F 'speed=42' assets/js/site.js
          grep -F '/assets/css/pricing.css?v=20260921-pairs2' ceny/index.html
          grep -F '/assets/js/site.js?v=20260921-pairs2' ceny/index.html
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-src/assets/site.js site-src/assets/pricing.css scripts/build_site.py assets/js/site.js assets/css/pricing.css ceny/index.html
          git commit -m 'Restore manual pair-by-pair pricing carousel'
          git push origin HEAD:main
