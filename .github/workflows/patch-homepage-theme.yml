name: Patch homepage

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/patch-homepage-theme.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        run: python scripts/patch_homepage_once.py
      - name: Validate and commit
        run: |
          git diff --check
          grep -F '/assets/css/home-light-fix.css?v=20260921-2' index.html
          grep -F 'nav.nav .theme-toggle{display:inline-grid!important' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix homepage theme toggle position and calculator contrast'
          git push origin HEAD:main
