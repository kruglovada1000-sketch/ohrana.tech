name: One-time restore three sectors image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-three-sectors-once.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore three sectors image reference
        run: python scripts/restore-three-sectors-once.py
      - name: Commit restore
        run: |
          git diff --check
          grep -F '/images/3-sektora.png' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore three sectors image on homepage'
          git push origin HEAD:main
